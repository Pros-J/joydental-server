  saveUsageGroup(e) {
    e.preventDefault();
    const form = e.target;
    const f = new FormData(form);
    const newDate = f.get('date');
    const newName = f.get('patient_name');
    const newNo = f.get('patient_no');

    const fixtureUsage = DB.getFixtureUsage();
    const matUsage = DB.getMatUsage();
    const fixtures = DB.getFixtures();
    const mats = DB.getImplantMaterials();

    const delFix = Pages._editDeleteIds?.fixture || [];
    const delMat = Pages._editDeleteIds?.mat || [];

    // 삭제된 기록 재고 복원
    delFix.forEach(id => {
      const rec = fixtureUsage.find(x => x.id === id);
      if (rec) { const fx = fixtures.find(x => x.id === rec.fixture_id); if (fx) fx.stock += rec.quantity; }
    });
    delMat.forEach(id => {
      const rec = matUsage.find(x => x.id === id);
      if (rec) { const mat = mats.find(x => x.id === rec.mat_id); if (mat && isTrackInventory(mat.category)) mat.stock += rec.quantity; }
    });
    const newFix = fixtureUsage.filter(r => !delFix.includes(r.id));
    const newMat = matUsage.filter(r => !delMat.includes(r.id));

    // 기존 항목 수정
    const tbody = document.getElementById('usage-rows-body');
    tbody.querySelectorAll('[data-etype]').forEach(row => {
      const etype = row.dataset.etype;
      const eid = +row.dataset.eid;
      if (etype === 'fixture') {
        const rec = newFix.find(x => x.id === eid);
        if (rec) {
          rec.date = newDate; rec.patient_name = newName; rec.patient_no = newNo;
          rec.tooth = f.get('etooth_fixture_' + eid) || '';
          rec.quantity = +(f.get('eqty_fixture_' + eid) || 1);
          rec.memo = f.get('ememo_fixture_' + eid) || '';
          rec.fail = !!form.querySelector('[name="efail_fixture_' + eid + '"]')?.checked;
        }
      } else {
        const rec = newMat.find(x => x.id === eid);
        if (rec) {
          rec.date = newDate; rec.patient_name = newName; rec.patient_no = newNo;
          rec.tooth = f.get('etooth_mat_' + eid) || '';
          rec.quantity = +(f.get('eqty_mat_' + eid) || 1);
          rec.memo = f.get('ememo_mat_' + eid) || '';
        }
      }
    });

    // 새로 추가된 항목 저장
    for (let i = 0; i < Pages._usageRowCount; i++) {
      const sel = document.querySelector('[name="item_key_' + i + '"]');
      if (!sel || !document.getElementById('urow-' + i)) continue;
      const val = sel.value; if (!val) continue;
      const [type, rawId] = val.split('_');
      const id = +rawId;
      const qty = +(document.querySelector('[name="qty_' + i + '"]')?.value || 1);
      const tooth = document.querySelector('[name="tooth_' + i + '"]')?.value || '';
      const memo = document.querySelector('[name="memo_' + i + '"]')?.value || '';
      if (type === 'fixture') {
        const fail = !!document.querySelector('[name="fail_' + i + '"]')?.checked;
        const fx = fixtures.find(x => x.id === id);
        if (fx && fx.stock < qty) { alert('재고 부족: ' + fx.company + ' ' + fx.diameter + '×' + fx.length + 'mm'); return; }
        if (fx) fx.stock -= qty;
        newFix.push({ id: DB.nextId('fusage'), date: newDate, patient_name: newName, patient_no: newNo, tooth, fixture_id: id, quantity: qty, memo, fail });
      } else {
        const mat = mats.find(x => x.id === id);
        if (mat && isTrackInventory(mat.category) && mat.stock < qty) { alert('재고 부족: ' + mat.name); return; }
        if (mat && isTrackInventory(mat.category)) mat.stock -= qty;
        newMat.push({ id: DB.nextId('musage'), date: newDate, patient_name: newName, patient_no: newNo, tooth, mat_id: id, quantity: qty, memo });
      }
    }

    DB.saveFixtures(fixtures);
    DB.saveImplantMaterials(mats);
    DB.saveFixtureUsage(newFix);
    DB.saveMatUsage(newMat);
    closeModal();
    Pages.implant(App.year, App.month);
  },

  // ── 주문 모달 ──
  _orderRowCount: 0,
  _orderItemOptsCache: '',
  _buildOrderItemOpts() {
    const fixtures = DB.getFixtures().sort((a,b)=>a.company.localeCompare(b.company)||(a.fixture_type||'').localeCompare(b.fixture_type||'')||(+a.diameter)-(+b.diameter));
    const allMats = DB.getImplantMaterials();
    const fOpts = fixtures.map(f => { const t = f.fixture_type ? ` ${f.fixture_type}` : ''; return `<option value="fixture_${f.id}" data-price="${f.unit_price||0}">[${f.company}]${t} ${f.diameter}×${f.length}mm</option>`; }).join('');
    const mOpts = allMats.map(m => { const spec = m.spec ? ` ${m.spec}` : ''; return `<option value="mat_${m.id}" data-price="${m.unit_price||0}">[${m.category}] ${m.name}${spec}</option>`; }).join('');
    return { fOpts, mOpts };
  },
  _orderItemRowHtml(idx, fOpts, mOpts, showPrice) {
    return `<tr id="orow-${idx}">
      <td style="min-width:240px">
        <select name="item_key_${idx}" onchange="Pages._oItemChange(${idx},this)" style="width:100%" required>
          ${fOpts ? `<optgroup label="── 픽스쳐 ──">${fOpts}</optgroup>` : ''}
          ${mOpts ? `<optgroup label="── 기타 재료 ──">${mOpts}</optgroup>` : ''}
        </select>
      </td>
      <td><input type="number" name="qty_${idx}" value="1" min="1" style="width:60px" required onchange="Pages._oCalcRow(${idx})"></td>
      ${showPrice ? `<td><input type="number" name="price_${idx}" value="" min="0" step="100" style="width:90px" placeholder="0" onchange="Pages._oCalcRow(${idx})"></td>
      <td><input type="number" name="total_${idx}" readonly style="width:90px;background:var(--gray-50)"></td>` : ''}
      <td><button type="button" class="btn btn-danger btn-sm" onclick="Pages._oRemoveRow(${idx})">×</button></td>
    </tr>`;
  },
  _oItemChange(idx, sel) {
    const price = sel?.options[sel.selectedIndex]?.dataset.price;
    const priceEl = document.querySelector(`[name="price_${idx}"]`);
    if (priceEl && price !== undefined) { priceEl.value = price; Pages._oCalcRow(idx); }
  },
  _oCalcRow(idx) {
    const qty   = +(document.querySelector(`[name="qty_${idx}"]`)?.value) || 0;
    const price = +(document.querySelector(`[name="price_${idx}"]`)?.value) || 0;
    const tot   = document.querySelector(`[name="total_${idx}"]`);
    if (tot) tot.value = qty * price;
  },
  _oRemoveRow(idx) {
    document.getElementById(`orow-${idx}`)?.remove();
  },
  _oAppendRow() {
    const { fOpts, mOpts } = Pages._buildOrderItemOpts();
    const showPrice = Auth.isAdmin();
    const tbody = document.getElementById('order-items-body');
    if (!tbody) return;
    const idx = Pages._orderRowCount++;
    tbody.insertAdjacentHTML('beforeend', Pages._orderItemRowHtml(idx, fOpts, mOpts, showPrice));
    setTimeout(() => Pages._oItemChange(idx, document.querySelector(`[name="item_key_${idx}"]`)), 0);
  },

  saveImplantOrder(e, editGroupId) {
    e.preventDefault();
    const f = new FormData(e.target);
    const date   = f.get('date');
    const vendor = f.get('vendor');
    const memo   = f.get('memo') || '';
    const status = f.get('status') || '주문서 작성';
    const admin  = Auth.isAdmin();

    // 품목 행 수집
    const tbody = document.getElementById('order-items-body');
    const rowIds = [...tbody.querySelectorAll('tr')].map(r => r.id.replace('orow-',''));
    if (!rowIds.length) { alert('품목을 하나 이상 추가해주세요.'); return; }

    const newItems = [];
    for (const idx of rowIds) {
      const itemKey = f.get(`item_key_${idx}`);
      if (!itemKey) continue;
      const [type, rawId] = itemKey.split('_');
      const itemId = +rawId;
      const qty = +f.get(`qty_${idx}`) || 1;
      const unitPrice = admin ? (+f.get(`price_${idx}`)||0)
        : (type === 'fixture' ? (DB.getFixtures().find(x=>x.id===itemId)?.unit_price||0)
                               : (DB.getImplantMaterials().find(x=>x.id===itemId)?.unit_price||0));
      const total = admin ? (+f.get(`total_${idx}`)||qty*unitPrice) : qty*unitPrice;
      let itemName = '';
      if (type === 'fixture') { const fx = DB.getFixtures().find(x=>x.id===itemId); if(fx) itemName=`[${fx.company}] 픽스쳐 ${fx.diameter}×${fx.length}mm`; }
      else { const mat = DB.getImplantMaterials().find(x=>x.id===itemId); if(mat) itemName=`[${mat.category}] ${mat.name}`; }
      newItems.push({ item_type: type, item_id: itemId, item_name: itemName, quantity: qty, unit_price: unitPrice, total });
    }
    if (!newItems.length) { alert('품목을 하나 이상 추가해주세요.'); return; }

    let orders = DB.getImplantOrders();
    const groupId = editGroupId !== null && editGroupId !== undefined ? editGroupId : (Math.max(0, ...orders.map(o => o.order_group_id||0)) + 1);

    if (editGroupId !== null && editGroupId !== undefined) {
      // 기존 그룹 삭제 — 품목별 item_status 기준으로 재고 복원
      const oldGroup = orders.filter(x => (x.order_group_id||x.id) === editGroupId);
      oldGroup.filter(r => r.item_status === '입고확인').forEach(rec => {
        if (rec.item_type === 'fixture') { const fxs = DB.getFixtures(); const fx = fxs.find(x=>x.id===rec.item_id); if(fx){fx.stock=Math.max(0,fx.stock-rec.quantity);DB.saveFixtures(fxs);} }
        else { const ms = DB.getImplantMaterials(); const m = ms.find(x=>x.id===rec.item_id); if(m&&isTrackInventory(m.category)){m.stock=Math.max(0,m.stock-rec.quantity);DB.saveImplantMaterials(ms);} }
      });
      orders = orders.filter(x => (x.order_group_id||x.id) !== editGroupId);
    }

    // 새 항목 저장 및 재고 반영
    // 새 항목은 item_status 없이 저장 (입고확인/반품 신청은 품목별로 별도 처리)
    newItems.forEach(item => {
      orders.push({ id: DB.nextId('iorder'), order_group_id: groupId, date, vendor, status, memo, item_status: '', item_type: item.item_type, item_id: item.item_id, item_name: item.item_name, quantity: item.quantity, unit_price: item.unit_price, total: item.total });
    });

    DB.saveImplantOrders(orders);
    closeModal();
    Pages.implant(App.year, App.month);
  },
  // 주문서 그룹 상태 변경 (주문서 작성 ↔ 주문서 발행 완료) — 재고 조정 없음
  setOrderStatus(groupId, newStatus) {
    const orders = DB.getImplantOrders();
    const group = orders.filter(x => (x.order_group_id || x.id) === groupId);
    if (!group.length) return;

    const doUpdate = () => {
      const orders2 = DB.getImplantOrders();
      orders2.filter(x => (x.order_group_id || x.id) === groupId).forEach(r => { r.status = newStatus; });
      DB.saveImplantOrders(orders2);
      Pages.implant(App.year, App.month);
    };

    if (newStatus === '주문서 발행 완료') {
      const { vendor, date } = group[0];
      const vendorInfo = DB.getVendors().find(v => v.name === vendor);
      const phone = vendorInfo?.phone;
      if (phone && !vendorInfo?.online_order) {
        const itemLines = group.map(r => {
          let name = '';
          if (r.item_type === 'fixture') {
            const fx = DB.getFixtures().find(x => x.id == r.item_id);
            if (fx) name = `${fx.company} 픽스쳐 ${fx.fixture_type||''} ${fx.diameter}x${fx.length}mm`.replace(/\s+/g,' ').trim();
          } else if (r.item_type === 'mat') {
            const mt = DB.getImplantMaterials().find(x => x.id == r.item_id);
            if (mt) name = `${mt.category} ${mt.name}${mt.spec ? ' ' + mt.spec : ''}`;
          }
          if (!name) name = (r.item_name || r.description || '품목').replace(/[\[\]]/g, '');
          return `- ${name} ${r.quantity}개`;
        }).join('\n');
        const text = `[조이치과] 주문서 발행\n거래처: ${vendor}\n날짜: ${date}\n\n${itemLines}`;
        smsConfirm(text, () => { doUpdate(); sendSms(phone, text); });
        return;
      }
    }
    doUpdate();
  },
  // 품목별 상태 변경 (입고확인 / 반품 신청) — 재고 조정 포함
  setItemStatus(itemId, newItemStatus) {
    const orders = DB.getImplantOrders();
    const rec = orders.find(x => x.id === itemId);
    if (!rec) return;
    const oldItemStatus = rec.item_status || '';
    if (oldItemStatus === newItemStatus) return;

    const doUpdate = () => {
      const orders2 = DB.getImplantOrders();
      const rec2 = orders2.find(x => x.id === itemId);
      if (!rec2) return;
      const wasIn = (rec2.item_status || '') === '입고확인';
      const nowIn = newItemStatus === '입고확인';
      if (wasIn !== nowIn) {
        if (rec2.item_type === 'fixture') {
          const fxs = DB.getFixtures(); const fx = fxs.find(x => x.id === rec2.item_id);
          if (fx) { fx.stock = nowIn ? fx.stock + rec2.quantity : Math.max(0, fx.stock - rec2.quantity); DB.saveFixtures(fxs); }
        } else {
          const ms = DB.getImplantMaterials(); const m = ms.find(x => x.id === rec2.item_id);
          if (m && isTrackInventory(m.category)) { m.stock = nowIn ? m.stock + rec2.quantity : Math.max(0, m.stock - rec2.quantity); DB.saveImplantMaterials(ms); }
        }
      }
      rec2.item_status = newItemStatus;
      DB.saveImplantOrders(orders2);
      Pages.implant(App.year, App.month);
    };

    if (newItemStatus === '반품 신청') {
      const vendorInfo = DB.getVendors().find(v => v.name === rec.vendor);
      const phone = vendorInfo?.phone;
      if (phone) {
        let name = rec.item_name || '';
        if (rec.item_type === 'fixture') {
          const fx = DB.getFixtures().find(x => x.id == rec.item_id);
          if (fx) name = `${fx.company} 픽스쳐 ${fx.fixture_type||''} ${fx.diameter}x${fx.length}mm`.replace(/\s+/g,' ').trim();
        } else if (rec.item_type === 'mat') {
          const mt = DB.getImplantMaterials().find(x => x.id == rec.item_id);
          if (mt) name = `${mt.category} ${mt.name}${mt.spec ? ' ' + mt.spec : ''}`;
        }
        const text = `[조이치과] 반품 신청\n거래처: ${rec.vendor}\n품목: ${name} × ${rec.quantity}개`;
        smsConfirm(text, () => { doUpdate(); sendSms(phone, text); });
        return;
      }
    }
    doUpdate();
  },

  saveQuickIncoming(e, type, id) {
    e.preventDefault();
    const f = new FormData(e.target);
    const qty = +f.get('quantity');
    const unitPrice = Auth.isAdmin() ? +f.get('unit_price') : (type === 'fixture'
      ? (DB.getFixtures().find(x=>x.id===id)?.unit_price||0)
      : (DB.getImplantMaterials().find(x=>x.id===id)?.unit_price||0));
    let itemName = '';

    if (type === 'fixture') {
      const fx = DB.getFixtures().find(x => x.id === id);
      if (fx) itemName = `[${fx.company}] 픽스쳐 ${fx.diameter}×${fx.length}mm`;
    } else {
      const mat = DB.getImplantMaterials().find(x => x.id === id);
      if (mat) itemName = `[${mat.category}] ${mat.name}`;
    }

    const orders = DB.getImplantOrders();
    orders.push({ id: DB.nextId('iorder'), date: f.get('date'), status: '주문서 작성', item_type: type, item_id: id, item_name: itemName, vendor: f.get('vendor'), quantity: qty, unit_price: unitPrice, total: qty * unitPrice, memo: '' });
    DB.saveImplantOrders(orders);
    closeModal();
    Pages.implant(App.year, App.month);
  },

  // ─── GENERAL DENTAL MATERIALS ───
  _gRowIdx: 0,
  general(y, m) {
    const admin = Auth.isAdmin();
    const orders = DB.getGeneralOrders().filter(r => inMonth(r.date, y, m));

    // helper: effective item status (backward compat with old flat records)
    const getIST = r => r.item_status !== undefined ? r.item_status
      : (r.status === '반품' ? '반품완료' : r.status === '입고확인' ? '입고확인' : '');

    // Group records by order_group_id (new) or individual id (old)
    const groupMap = {};
    [...orders].sort((a,b) => b.date.localeCompare(a.date)).forEach(r => {
      const gid = r.order_group_id != null ? r.order_group_id : r.id;
      if (!groupMap[gid]) groupMap[gid] = {
        gid,
        date: r.date,
        vendor: r.vendor || '',
        orderStatus: r.order_group_id != null ? (r.status || '주문서 작성') : null,
        memo: r.memo || '',
        items: []
      };
      groupMap[gid].items.push(r);
    });
    const groups = Object.values(groupMap).sort((a,b) => b.date.localeCompare(a.date));
    const onlineVendorNames = new Set(DB.getVendors().filter(v => v.online_order).map(v => v.name));

    const orderBadge = st => st === '주문서 발행 완료'
      ? `<span class="badge" style="background:#ede9fe;color:#7c3aed">발행 완료</span>`
      : `<span class="badge badge-orange">주문서 작성</span>`;
    const itemBadge = ist => {
      if (ist === '입고확인')  return `<span class="badge badge-green" style="font-size:10px">입고확인</span>`;
      if (ist === '반품 신청') return `<span class="badge" style="background:#fee2e2;color:#dc2626;font-size:10px">반품 신청</span>`;
      if (ist === '반품완료')  return `<span class="badge badge-gray" style="font-size:10px">반품완료</span>`;
      return `<span style="color:var(--gray-400);font-size:11px">대기중</span>`;
    };

    // col count: 상태|날짜|거래처/내용|수량|[단가]|[합계]|액션
    const cols = admin ? 7 : 5;

    const rows = groups.length ? groups.map(g => {
      const isNew = g.orderStatus !== null;
      const isPublished = g.orderStatus === '주문서 발행 완료';
      const groupTotal = sum(g.items, i => i.total_amount || i.amount || 0);
      const rowBg = isPublished ? '#f5f3ff' : '';

      const itemLines = g.items.map(r => {
        const ist = getIST(r);
        let itemActs = '';
        {
          if (ist === '') {
            itemActs = `<button class="btn btn-sm" style="background:#22c55e;color:#fff;font-size:10px;padding:2px 7px" onclick="Pages.setGeneralItemStatus(${r.id},'입고확인')">입고확인</button>
              <button class="btn btn-sm" style="background:#dc2626;color:#fff;font-size:10px;padding:2px 7px" onclick="Pages.setGeneralItemStatus(${r.id},'반품 신청')">반품 신청</button>`;
          } else if (ist === '입고확인') {
            itemActs = `<button class="btn btn-secondary btn-sm" style="font-size:10px;padding:2px 7px" onclick="Pages.setGeneralItemStatus(${r.id},'')">취소</button>
              <button class="btn btn-sm" style="background:#dc2626;color:#fff;font-size:10px;padding:2px 7px" onclick="Pages.setGeneralItemStatus(${r.id},'반품 신청')">반품 신청</button>`;
          } else if (ist === '반품 신청') {
            itemActs = `<button class="btn btn-sm btn-primary" style="font-size:10px;padding:2px 7px" onclick="Pages.setGeneralItemStatus(${r.id},'반품완료')">반품완료</button>
              <button class="btn btn-secondary btn-sm" style="font-size:10px;padding:2px 7px" onclick="Pages.setGeneralItemStatus(${r.id},'')">취소</button>`;
          } else if (ist === '반품완료') {
            itemActs = `<button class="btn btn-secondary btn-sm" style="font-size:10px;padding:2px 7px" onclick="Pages.setGeneralItemStatus(${r.id},'반품 신청')">되돌리기</button>`;
          }
        }
        const amtStyle = ist === '반품완료' ? 'color:var(--gray-400);text-decoration:line-through'
          : ist === '반품 신청' ? 'color:var(--red)' : '';
        return `<tr style="background:${ist==='반품완료'?'#f9fafb':ist==='반품 신청'?'#fff5f5':''}">
          <td style="padding-left:24px">${itemBadge(ist)}</td>
          <td style="color:var(--gray-400);font-size:11px"></td>
          <td colspan="2">${r.description||''}</td>
          <td class="text-center" style="font-size:12px">${r.quantity||'-'}</td>
          ${admin ? `<td class="text-right" style="font-size:12px;color:var(--gray-400)">${r.unit_price?fmt.won(r.unit_price):'-'}</td>` : ''}
          ${admin ? `<td class="text-right amount" style="${amtStyle}">${r.total_amount||r.amount?fmt.won(r.total_amount||r.amount):'-'}</td>` : ''}
          <td style="white-space:nowrap">${itemActs}</td>
        </tr>`;
      }).join('');

      let groupActs = '';
      if (isNew) {
        const isOnline = onlineVendorNames.has(g.vendor);
        if (!isPublished && !isOnline) {
          groupActs = `<button class="btn btn-sm" style="background:#7c3aed;color:#fff" onclick="Pages.publishGeneralGroup(${g.gid})">주문서 발행</button>
            <button class="btn btn-secondary btn-sm" onclick="Pages.editGeneralGroupModal(${g.gid})">수정</button>`;
        } else {
          groupActs = `<button class="btn btn-secondary btn-sm" onclick="Pages.editGeneralGroupModal(${g.gid})">수정</button>`;
        }
        groupActs += `<button class="btn btn-danger btn-sm" onclick="Pages.deleteGeneralGroup(${g.gid})">삭제</button>`;
      } else {
        // old flat record
        const r0 = g.items[0];
        groupActs = `<button class="btn btn-secondary btn-sm" onclick="Pages.editGeneralGroupModal('old_${r0.id}')">수정</button>
          <button class="btn btn-danger btn-sm" onclick="Pages.deleteGeneralOrder(${r0.id})">삭제</button>`;
      }

      const headerBadge = isNew ? orderBadge(g.orderStatus) : itemBadge(getIST(g.items[0]));
      return `<tr style="background:${rowBg}">
        <td>${headerBadge}</td>
        <td>${fmt.dateFull(g.date)}</td>
        <td><strong>${g.vendor}</strong></td>
        <td style="color:var(--gray-400);font-size:12px">${isNew ? (g.memo||'') : (g.items[0].note||'')}</td>
        <td class="text-center" style="font-size:12px">${g.items.length}개 품목</td>
        ${admin ? `<td></td>` : ''}
        ${admin ? `<td class="text-right amount">${groupTotal ? fmt.won(groupTotal) : '-'}</td>` : ''}
        <td style="white-space:nowrap">${groupActs}</td>
      </tr>${itemLines}`;
    }).join('')
    : `<tr><td colspan="${cols+2}" class="tbl-empty">이번 달 일반 재료 주문 내역이 없습니다</td></tr>`;

    const grandTotal = admin ? sum(orders.filter(r => {
      const ist = getIST(r);
      return ist !== '반품완료';
    }), r => r.total_amount || r.amount || 0) : 0;

    const vendorSection = Pages._staffVendorBlock('일반재료', '일반 치과재료 거래처');
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">일반 치과 재료 주문</div>
            ${admin && grandTotal ? `<div style="font-size:12px;color:var(--gray-400)">이달 합계 (반품완료 제외): <strong>${fmt.won(grandTotal)}</strong></div>` : ''}
          </div>
          <button class="btn btn-primary" onclick="Pages.addGeneralGroupModal()">+ 주문서 추가</button>
        </div>
        <div class="tbl-wrap"><table>
          <thead><tr>
            <th>상태</th><th>날짜</th><th>거래처</th><th>메모/내용</th><th class="text-center">수량</th>
            ${admin ? '<th class="text-right">단가</th>' : ''}
            ${admin ? '<th class="text-right">금액</th>' : ''}
            <th></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>
      ${vendorSection}`;
    Pages._bindDrag();
  },

  setGeneralItemStatus(id, newStatus) {
    const data = DB.getGeneralOrders();
    const rec = data.find(r => r.id === id);
    if (!rec) return;

    const doUpdate = () => {
      const data2 = DB.getGeneralOrders();
      const rec2 = data2.find(r => r.id === id);
      if (!rec2) return;
      if (rec2.order_group_id != null) {
        rec2.item_status = newStatus;
      } else {
        rec2.status = newStatus === '반품완료' ? '반품' : newStatus === '입고확인' ? '입고확인' : '주문';
      }
      DB.saveGeneralOrders(data2);
      Pages.general(App.year, App.month);
    };

    if (newStatus === '반품 신청') {
      const vendorInfo = DB.getVendors().find(v => v.name === rec.vendor);
      const phone = vendorInfo?.phone;
      if (phone) {
        const text = `[조이치과] 반품 신청\n거래처: ${rec.vendor}\n품목: ${rec.description} × ${rec.quantity}개`;
        smsConfirm(text, () => { doUpdate(); sendSms(phone, text); });
        return;
      }
    }
    doUpdate();
  },

  publishGeneralGroup(gid) {
    const data = DB.getGeneralOrders();
    const group = data.filter(r => r.order_group_id === gid);
    if (!group.length) return;

    const doUpdate = () => {
      const data2 = DB.getGeneralOrders();
      data2.filter(r => r.order_group_id === gid).forEach(r => { r.status = '주문서 발행 완료'; });
      DB.saveGeneralOrders(data2);
      Pages.general(App.year, App.month);
    };

    const { vendor, date } = group[0];
    const vendorInfo = DB.getVendors().find(v => v.name === vendor);
    const phone = vendorInfo?.phone;
    if (phone && !vendorInfo?.online_order) {
      const itemLines = group.map(r => `- ${r.description} ${r.quantity}개`).join('\n');
      const text = `[조이치과] 주문서 발행\n거래처: ${vendor}\n날짜: ${date}\n\n${itemLines}`;
      smsConfirm(text, () => { doUpdate(); sendSms(phone, text); });
      return;
    }
    doUpdate();
  },

  _gItemRowHtml(idx, admin, d) {
    return `<tr id="grow-${idx}">
      <td><input type="text" name="gdesc_${idx}" value="${d?.description||''}" placeholder="품목 내용" required style="width:100%;min-width:140px"></td>

      <td><input type="number" name="gtotal_${idx}" value="${d?.total_amount||0}" min="0" step="100" style="width:90px"></td>` : ''}

    </tr>`;

  _gCalcRow(idx) {
    const qty = +(document.querySelector(`[name="gqty_${idx}"]`)?.value)||0;

    const t = document.querySelector(`[name="gtotal_${idx}"]`);
    if (t) t.value = qty * price;

    const admin = Auth.isAdmin();

    tr.id = `grow-${idx}`;

      <td><input type="number" name="gqty_${idx}" value="1" min="1" style="width:60px" oninput="Pages._gCalcRow(${idx})"></td>
      ${admin ? `<td><input type="number" name="gprice_${idx}" value="0" min="0" step="100" style="width:80px" oninput="Pages._gCalcRow(${idx})"></td>

      document.querySelectorAll('[name="gstatus"]').forEach(r => { r.checked = r.value === '주문서 발행 완료'; });
    }
  },

  saveGeneralGroup(e, editKey) {
    e.preventDefault();
    const f = new FormData(e.target);
    const admin = Auth.isAdmin();
    const date = f.get('gdate');
    const vendor = f.get('gvendor');
    const memo = f.get('gmemo') || '';
    const isOnlineVendor = DB.getVendors().some(v => v.name === vendor && v.online_order);
    const status = isOnlineVendor ? '주문서 발행 완료' : (f.get('gstatus') || '주문서 작성');

    const tbody = document.getElementById('gorder-items-body');
    const rowIds = [...tbody.querySelectorAll('tr')].map(r => r.id.replace('grow-',''));
    if (!rowIds.length) { alert('품목을 추가해주세요.'); return; }

    const newItems = rowIds.map(idx => {
      const desc = f.get(`gdesc_${idx}`);
      if (!desc) return null;
      return {
        description: desc,
        quantity: +f.get(`gqty_${idx}`) || 1,
        unit_price: admin ? (+f.get(`gprice_${idx}`) || 0) : 0,
        total_amount: admin ? (+f.get(`gtotal_${idx}`) || 0) : 0
      };
    }).filter(Boolean);
    if (!newItems.length) { alert('품목 내용을 입력해주세요.'); return; }

    let allOrders = DB.getGeneralOrders();
    let gid;

    if (editKey === null) {
      // new group
      gid = Math.max(0, ...allOrders.map(o => o.order_group_id || 0)) + 1;
    } else if (typeof editKey === 'string' && editKey.startsWith('old_')) {
      // converting old flat record to new group
      const oldId = +editKey.replace('old_', '');
      allOrders = allOrders.filter(r => r.id !== oldId);
      gid = Math.max(0, ...allOrders.map(o => o.order_group_id || 0)) + 1;
    } else {
      // editing existing group
      gid = +editKey;
      // preserve item_status of matched items by description
      const oldItems = allOrders.filter(r => r.order_group_id === gid);
      const statusByDesc = {};
      oldItems.forEach(r => { statusByDesc[r.description] = r.item_status || ''; });
      allOrders = allOrders.filter(r => r.order_group_id !== gid);
      newItems.forEach(it => { it._oldStatus = statusByDesc[it.description] || ''; });
    }

    newItems.forEach(it => {
      allOrders.push({
        id: DB.nextId('gorder'),
        order_group_id: gid,
        date, vendor, status, memo,
        item_status: it._oldStatus || '',
        description: it.description,
        quantity: it.quantity,
        unit_price: it.unit_price,
        total_amount: it.total_amount,
        note: ''
      });
    });

    DB.saveGeneralOrders(allOrders);
    closeModal();
    Pages.general(App.year, App.month);
  },

  toggleLabStatus(id) {
    const data = DB.getLabWork();
    const rec = data.find(r => r.id === id);
    if (!rec) return;
    rec.status = (rec.status === '도착확인') ? '의뢰' : '도착확인';
    DB.saveLabWork(data);
    Pages.lab(App.year, App.month);
  },
  saveLabWork(e, editId) {
    e.preventDefault();
    const f = new FormData(e.target);
    const data = DB.getLabWork();
    const getAmt = (existing) => Auth.isAdmin() ? (+f.get('amount') || 0) : (existing || 0);
    const base = { date: f.get('date'), lab_name: f.get('lab_name'), patient_name: f.get('patient_name'), prosthetic_type: f.get('prosthetic_type'), tooth_numbers: f.get('tooth_numbers'), delivery_date: f.get('delivery_date'), status: f.get('status') || '의뢰', note: f.get('note') };
    if (editId) {
      const idx = data.findIndex(r => r.id === editId);
      if (idx >= 0) data[idx] = { ...data[idx], ...base, amount: getAmt(data[idx].amount) };
    } else {
      data.push({ id: DB.nextId('lab'), ...base, amount: getAmt(0) });
    }
    DB.saveLabWork(data);
    Pages._labTab = 'list';
    Pages.lab(App.year, App.month);
  },
  editLabWork(id) {
    const rec = DB.getLabWork().find(r => r.id === id);
    if (!rec) return;
    document.getElementById('content').querySelector('.card').innerHTML =
      `<div class="tabs"><button class="tab" onclick="Pages._labTab='list';Pages.lab(App.year,App.month)">의뢰 목록</button><button class="tab active">의뢰 수정</button></div>` +
      Pages._labAddForm(rec);
  },

      DB.saveLabWork(DB.getLabWork().filter(r => r.id !== id));
      Pages.lab(App.year, App.month);
    });
  },

  // ─── MONTHLY REPORT ───
  report(y, m) {
    const direct = DB.getDirectExpenses().filter(r => inMonth(r.date, y, m));
    const implantOrders = DB.getImplantOrders().filter(r => inMonth(r.date, y, m));
    const fixtureUsage = DB.getFixtureUsage().filter(r => inMonth(r.date, y, m));
    const matUsage = DB.getMatUsage().filter(r => inMonth(r.date, y, m));
    const generalOrders = DB.getGeneralOrders().filter(r => inMonth(r.date, y, m));
    const labWork = DB.getLabWork().filter(r => inMonth(r.date, y, m));
    const fixtures = DB.getFixtures();
    const mats = DB.getImplantMaterials();
    const settings = DB.getSettings();

    // Direct by category
    const directByCat = {};
    direct.forEach(r => { directByCat[r.category] = (directByCat[r.category]||0) + r.amount; });

    // ── 임플란트 재료 주문액 (반품완료 품목 제외) ──
    const totalImplantOrder = sum(implantOrders.filter(r => r.item_status !== '반품완료'), r => r.total);

    // ── 임플란트 재료 사용액 (사용 기록 기준, 페일 반품완료 제외) ──
    const fixtureCost = sum(
      fixtureUsage.filter(r => !(r.fail && r.return_status === '반품 완료')),
      r => { const f = fixtures.find(x => x.id === r.fixture_id); return (f?.unit_price||0) * r.quantity; }
    );
    const matCost = sum(matUsage, r => { const mt = mats.find(x => x.id === r.mat_id); return (mt?.unit_price||0) * r.quantity; });
    const totalImplantUsage = fixtureCost + matCost;

    // Implant orders breakdown by type (반품완료 제외)
    const implantByType = {};
    implantOrders.filter(r => r.item_status !== '반품완료').forEach(r => {
      const cat = r.item_type === 'fixture' ? '픽스쳐' : (() => {
        const mat = mats.find(x => x.id === r.item_id);
        return mat ? mat.category : '기타';
      })();
      implantByType[cat] = (implantByType[cat]||0) + r.total;
    });

    // Lab by lab
    const labByLab = {};
    labWork.forEach(r => { labByLab[r.lab_name] = (labByLab[r.lab_name]||0) + r.amount; });

    const totalDirect = sum(direct, r => r.amount);
    const _getGIST = r => r.item_status !== undefined ? r.item_status
      : (r.status === '반품' ? '반품완료' : r.status === '입고확인' ? '입고확인' : '');
    const totalGeneral = sum(generalOrders.filter(r => _getGIST(r) !== '반품완료'), r => r.total_amount||r.amount||0);
    const totalLab = sum(labWork, r => r.amount);
    const grandTotal = totalDirect + totalImplantOrder + totalGeneral + totalLab;

    const directRows = Object.entries(directByCat).map(([k,v]) => `
      <div class="report-row"><span>${k}</span><strong>${fmt.won(v)}</strong></div>`).join('') ||
      `<div class="report-row" style="color:var(--gray-400)"><span>내역 없음</span><strong>-</strong></div>`;

    const implantRows = Object.entries(implantByType).map(([k,v]) => `
      <div class="report-row"><span>${k}</span><strong>${fmt.won(v)}</strong></div>`).join('') ||
      `<div class="report-row" style="color:var(--gray-400)"><span>내역 없음</span><strong>-</strong></div>`;

    const labRows = Object.entries(labByLab).map(([k,v]) => `
      <div class="report-row"><span>${k}</span><strong>${fmt.won(v)}</strong></div>`).join('') ||
      `<div class="report-row" style="color:var(--gray-400)"><span>내역 없음</span><strong>-</strong></div>`;

    const generalActive = generalOrders.filter(r => r.status !== '반품');
    const generalRows = generalActive.length
      ? generalActive.slice(0,5).map(r => `<div class="report-row"><span>${r.vendor} · ${r.description}</span><strong>${fmt.won(r.total_amount||r.amount||0)}</strong></div>`).join('') +
        (generalActive.length > 5 ? `<div class="report-row" style="color:var(--gray-400)"><span>... 외 ${generalActive.length-5}건</span><strong></strong></div>` : '')
      : `<div class="report-row" style="color:var(--gray-400)"><span>내역 없음</span><strong>-</strong></div>`;

    document.getElementById('content').innerHTML = `
      <div class="card" style="max-width:700px">
        <div class="card-header">
          <div class="card-title">📋 ${fmt.ym(y,m)} 지출 리포트</div>
          <button class="btn btn-ghost btn-sm" onclick="Pages._printReport()">🖨️ 인쇄</button>
        </div>

        <div class="report-section">
          <div style="font-weight:700;margin-bottom:8px;color:var(--primary)">💳 직접 지출</div>
          ${directRows}
          <div class="report-row report-total"><span>소계</span><strong>${fmt.won(totalDirect)}</strong></div>
        </div>

        <div class="report-section">
          <div style="font-weight:700;margin-bottom:8px;color:#7c3aed">🔩 임플란트 재료 주문액</div>
          ${implantRows}
          <div class="report-row report-total"><span>소계 (발주 기준)</span><strong>${fmt.won(totalImplantOrder)}</strong></div>
          <div class="report-row" style="color:var(--gray-500);font-size:12px"><span>↳ 사용 기록 기준</span><strong>${fmt.won(totalImplantUsage)}</strong></div>
        </div>

        <div class="report-section">
          <div style="font-weight:700;margin-bottom:8px;color:#0891b2">📦 일반 치과 재료</div>
          ${generalRows}
          <div class="report-row report-total"><span>소계</span><strong>${fmt.won(totalGeneral)}</strong></div>
        </div>

        <div class="report-section">
          <div style="font-weight:700;margin-bottom:8px;color:var(--yellow)">🏭 기공 의뢰</div>
          ${labRows}
          <div class="report-row report-total"><span>소계</span><strong>${fmt.won(totalLab)}</strong></div>
        </div>

        <div style="background:var(--primary);color:#fff;padding:16px 20px;border-radius:8px;display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:700;font-size:15px">이달 총 지출</span>
          <span style="font-weight:700;font-size:22px">${fmt.won(grandTotal)}</span>
        </div>
      </div>`;
  },
  _printReport() { window.print(); },

  // 이동 헬퍼

        ${handle}

  _bindDrag() {
    // ── 항목 드래그 ──
    let dragSrc = null;
    document.querySelectorAll('.s-item[draggable]').forEach(el => {
      el.addEventListener('dragstart', e => {
        dragSrc = el;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      el.addEventListener('dragend', () => {
        dragSrc = null;
        document.querySelectorAll('.s-item').forEach(x => x.classList.remove('dragging','drag-over'));
      });
      el.addEventListener('dragover', e => {
        e.preventDefault();
        if (dragSrc && dragSrc !== el && dragSrc.dataset.list === el.dataset.list) {
          document.querySelectorAll('.s-item').forEach(x => x.classList.remove('drag-over'));
          el.classList.add('drag-over');
        }
      });
      el.addEventListener('drop', e => {
        e.preventDefault();
        if (!dragSrc || dragSrc === el || dragSrc.dataset.list !== el.dataset.list) return;
        const list = dragSrc.dataset.list;
        const from = parseInt(dragSrc.dataset.idx);
        const to   = parseInt(el.dataset.idx);
        const s = DB.getSettings();
        const listMap = {
          labs:        () => { s.labs = this._moveArr(s.labs, from, to); DB.saveSettings(s); },
          cats:        () => { s.directCategories = this._moveArr(s.directCategories, from, to); DB.saveSettings(s); },
          companies:   () => { s.fixtureCompanies = this._moveArr(s.fixtureCompanies, from, to); DB.saveSettings(s); },
          matCats:     () => { s.implantMatCategories = this._moveArr(s.implantMatCategories, from, to); DB.saveSettings(s); },
          prosthetics: () => { s.prostheticTypes = this._moveArr(s.prostheticTypes||[], from, to); DB.saveSettings(s); },
        };
        if (listMap[list]) {
          listMap[list]();
          if (App.page === 'settings') Pages.settings(App.year, App.month); else App.renderCurrentPage();
        } else if (list.startsWith('vendors_')) {
          const fromGIdx = parseInt(dragSrc.dataset.gidx);
          const toGIdx   = parseInt(el.dataset.gidx);
          DB.saveVendors(this._moveArr(DB.getVendors(), fromGIdx, toGIdx));
          if (App.page === 'settings') Pages.settings(App.year, App.month); else App.renderCurrentPage();
        }
      });
    });

    // ── 블록 드래그 (배너 내) ──
    let dragBlock = null;
    document.querySelectorAll('.s-block-wrap[draggable]').forEach(el => {
      el.addEventListener('dragstart', e => {
        dragBlock = el;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.stopPropagation();
      });
      el.addEventListener('dragend', () => {
        dragBlock = null;
        document.querySelectorAll('.s-block-wrap').forEach(x => x.classList.remove('dragging','drag-over'));
      });
      el.addEventListener('dragover', e => {
        e.preventDefault();
        e.stopPropagation();
        if (dragBlock && dragBlock !== el && dragBlock.dataset.banner === el.dataset.banner) {
          document.querySelectorAll('.s-block-wrap').forEach(x => x.classList.remove('drag-over'));
          el.classList.add('drag-over');
        }
      });
      el.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        if (!dragBlock || dragBlock === el || dragBlock.dataset.banner !== el.dataset.banner) return;
        const banner = dragBlock.dataset.banner;
        const defaults = { implant: ['companies','matCats'], lab: ['labs','prosthetics'] };
        const s = DB.getSettings();
        if (!s.blockOrder) s.blockOrder = {};
        const order = s.blockOrder[banner] || [...defaults[banner]];
        const from = order.indexOf(dragBlock.dataset.key);
        const to   = order.indexOf(el.dataset.key);
        if (from < 0 || to < 0) return;
        const newOrder = [...order];
        newOrder.splice(to, 0, newOrder.splice(from, 1)[0]);
        s.blockOrder[banner] = newOrder;
        DB.saveSettings(s);
        Pages.settings(App.year, App.month);
      });
    });
  },

  // 블록 순서 변경
  moveBlock(banner, i, dir) {
    const s = DB.getSettings();
    if (!s.blockOrder) s.blockOrder = {};
    const defaults = { implant: ['companies','matCats'], lab: ['labs','prosthetics'] };
    if (!s.blockOrder[banner]) s.blockOrder[banner] = [...defaults[banner]];
    s.blockOrder[banner] = this._moveArr(s.blockOrder[banner], i, dir);
    this._saveAndRefresh(s);
  },

        </div>
      </form>
    </div>`);
  },
  saveProstheticType(e, editIdx) {
    e.preventDefault();
    const f = new FormData(e.target);
    const s = DB.getSettings();
    const name = f.get('name').trim();
    if (!name) return;
    if (!s.prostheticTypes) s.prostheticTypes = [];
    if (editIdx !== null && editIdx !== undefined) s.prostheticTypes[editIdx] = name;
    else { if (s.prostheticTypes.includes(name)) { alert('이미 존재합니다.'); return; } s.prostheticTypes.push(name); }
    closeModal(); this._saveAndRefresh(s);
  },
  moveProsthetic(i, dir) {
    const s = DB.getSettings(); s.prostheticTypes = this._moveArr(s.prostheticTypes||[], i, dir); this._saveAndRefresh(s);
  },
  deleteProstheticType(i) {
    confirm2('이 보철 종류를 삭제하시겠습니까?', () => {
      const s = DB.getSettings(); (s.prostheticTypes||[]).splice(i,1); this._saveAndRefresh(s);
    });
  },

  savePassword(e, role) {
    e.preventDefault();
    const f = new FormData(e.target);
    const s = DB.getSettings();
    if (!s.credentials) s.credentials = { adminPassword: '1234', staffPassword: '' };
    if (role === 'admin') {
      if (f.get('current') !== s.credentials.adminPassword) { alert('현재 비밀번호가 틀렸습니다.'); return; }
      if (f.get('next') !== f.get('confirm')) { alert('새 비밀번호가 일치하지 않습니다.'); return; }
      if (!f.get('next')) { alert('비밀번호를 입력해주세요.'); return; }
      s.credentials.adminPassword = f.get('next');
    } else {
      if (f.get('next') !== f.get('confirm')) { alert('비밀번호가 일치하지 않습니다.'); return; }
      s.credentials.staffPassword = f.get('next');
    }
    DB.saveSettings(s);
    alert(role === 'admin' ? '원장 비밀번호가 변경되었습니다.' : '직원 비밀번호가 변경되었습니다.');
    e.target.reset();
  },

  exportData() {
    // 캐시와 localStorage 모두 합쳐서 내보내기
    const data = {};
    Object.keys(localStorage).filter(k => k.startsWith('dc_')).forEach(k => {
      try { data[k] = JSON.parse(localStorage.getItem(k)); } catch {}
    });
    Object.entries(DB._cache).forEach(([k, v]) => { if (k.startsWith('dc_')) data[k] = v; });
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `조이치과_백업_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  },
  importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async evt => {
      try {
        const data = JSON.parse(evt.target.result);
        Object.entries(data).forEach(([k,v]) => {
          DB._cache[k] = v;
          localStorage.setItem(k, JSON.stringify(v));
          // 서버에도 업로드
          if (DB._serverOk && SERVER_URL) {
            fetch(`${SERVER_URL}/api/data/${k}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(v)
            }).catch(() => {});
          }
        });
        alert('데이터를 성공적으로 가져왔습니다.');
        App.renderCurrentPage();
      } catch { alert('올바른 JSON 파일이 아닙니다.'); }
    };
    reader.readAsText(file);
  },
  resetAll() {
    if (!confirm('모든 데이터를 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) return;
    // 로컬 초기화
    Object.keys(localStorage).filter(k => k.startsWith('dc_')).forEach(k => localStorage.removeItem(k));
    DB._cache = {};
    // 서버 초기화
    if (DB._serverOk && SERVER_URL) {
      fetch(`${SERVER_URL}/api/data`, { method: 'DELETE' }).catch(() => {});
    }
    alert('초기화 완료');
    App.renderCurrentPage();
  },

  // ── 거래처 관리 ──
  _vendorCats: ['임플란트', '일반재료', '기공소', '기타'],
  _renderVendorList() {
    const vendors = DB.getVendors();
    if (!vendors.length) return '<div style="color:var(--gray-400);font-size:13px;padding:8px 0">등록된 거래처 없음</div>';
    const byCat = {};
    this._vendorCats.forEach(c => { byCat[c] = vendors.filter(v => v.category === c); });
    return this._vendorCats.map(cat => {
      if (!byCat[cat].length) return '';
      const rows = byCat[cat].map(v => `
        <div class="item-row">
          <span class="badge badge-gray" style="min-width:60px;text-align:center">${v.category}</span>
          <span style="flex:1;font-weight:500">${v.name}</span>
          <span style="color:var(--gray-400);font-size:12px;min-width:120px">${v.online_order ? '<span style="color:#1d4ed8">온라인 주문</span>' : [v.manager, v.phone].filter(Boolean).join(' · ')}</span>
          <button class="btn btn-secondary btn-sm" onclick="Pages.editVendorModal(${v.id})">수정</button>
          <button class="btn btn-danger btn-sm" onclick="Pages.deleteVendor(${v.id})">삭제</button>
        </div>`).join('');
      return `<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:600;color:var(--gray-400);margin-bottom:4px;text-transform:uppercase">${cat}</div>${rows}</div>`;
    }).join('');
  },
  addVendorModal(editId, defaultCat) {
    const v = editId ? DB.getVendors().find(x => x.id === editId) : null;
    const activeCat = v?.category || defaultCat || '임플란트';
    const catOpts = this._vendorCats.map(c => `<option value="${c}" ${activeCat===c?'selected':''}>${c}</option>`).join('');
    const catDesc = { '임플란트':'임플란트 재료 입고 모달', '일반재료':'일반 재료 주문 모달', '기공소':'기공 의뢰 모달', '기타':'직접 지출 모달' };
    showModal(`<div class="modal" style="max-width:420px">
      <div class="modal-title">${v ? '거래처 수정' : '거래처 추가'}</div>
      <form onsubmit="Pages.saveVendor(event,${editId||'null'})">
        <div class="form-grid">
          <div class="form-group" style="grid-column:1/-1">
            <label>분류 <span style="font-weight:400;color:var(--gray-400);font-size:11px">— 선택한 분류의 모달에서 자동완성으로 표시됩니다</span></label>
            <select name="category" id="vendor-cat-sel" onchange="document.getElementById('vendor-cat-hint').textContent=({'임플란트':'임플란트 재료 입고 모달','일반재료':'일반 재료 주문 모달','기공소':'기공 의뢰 모달','기타':'직접 지출 모달'})[this.value]||''">
              ${catOpts}
            </select>
            <div id="vendor-cat-hint" style="font-size:11px;color:var(--primary);margin-top:3px">${catDesc[activeCat]||''}</div>
          </div>
          <div class="form-group" style="grid-column:1/-1"><label>거래처명</label><input type="text" name="name" value="${v?.name||''}" required placeholder="거래처명"></div>
          <div class="form-group" style="grid-column:1/-1">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:600;margin:0">
              <input type="checkbox" id="vendor-online-chk" name="online_order" value="1" ${v?.online_order?'checked':''} onchange="Pages._toggleVendorOnline(this.checked)" style="width:16px;height:16px;accent-color:var(--primary)">
              온라인 주문 (담당자·연락처 없음)
            </label>
          </div>
          <div class="form-group"><label>담당자명</label><input id="vendor-manager" type="text" name="manager" value="${v?.manager||''}" placeholder="담당자 이름" ${v?.online_order?'disabled':''}></div>
          <div class="form-group" style="grid-column:1/-1">
            <label>연락처 <span style="font-weight:400;color:var(--gray-400);font-size:11px">— 띄어쓰기·특수기호 없이 숫자만 입력 (예: 01012345678)</span></label>
            <input id="vendor-phone" type="text" name="phone" value="${v?.phone||''}" placeholder="01012345678" inputmode="numeric" ${v?.online_order?'disabled':''}>
          </div>
          <div class="form-group" style="grid-column:1/-1"><label>메모</label><input type="text" name="note" value="${v?.note||''}" placeholder="추가 메모"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button>
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </form>
    </div>`);
  },
  editVendorModal(id) { this.addVendorModal(id, null); },
  _toggleVendorOnline(checked) {
    const mgr = document.getElementById('vendor-manager');
    const ph  = document.getElementById('vendor-phone');
    if (mgr) mgr.disabled = checked;
    if (ph)  ph.disabled  = checked;
  },
  saveVendor(e, editId) {
    e.preventDefault();
    const f = new FormData(e.target);
    const vendors = DB.getVendors();
    const online = !!f.get('online_order');
    const item = { category: f.get('category'), name: f.get('name'), online_order: online, manager: online ? '' : (f.get('manager')||''), phone: online ? '' : (f.get('phone')||''), note: f.get('note') };
    if (editId) {
      const idx = vendors.findIndex(v => v.id === editId);
      if (idx >= 0) vendors[idx] = { ...vendors[idx], ...item };
    } else {
      const maxId = Math.max(0, ...vendors.map(v => v.id));
      vendors.push({ id: maxId + 1, ...item });
    }
    DB.saveVendors(vendors);
    closeModal();
    App.renderCurrentPage();
  },
  deleteVendor(id) {
    confirm2('이 거래처를 삭제하시겠습니까?', () => {
      DB.saveVendors(DB.getVendors().filter(v => v.id !== id));
      App.renderCurrentPage();
    });
  },

  // 기공의뢰 탭 직원용 — 기공소 관리 + 보철 종류 관리
  _staffLabManageBlock() {
    const s = DB.getSettings();
    const handle = `<span class="drag-handle" title="드래그해서 순서 변경">⠿</span>`;

    const labRows = s.labs.map((l,i) => `
      <div class="s-item" draggable="true" data-list="labs" data-idx="${i}">
        ${handle}
        <div class="name">${l.name}</div>
        <div class="sub">${l.contact||''}</div>
        <button class="btn btn-secondary btn-sm" onclick="Pages.editLabModal(${l.id})">수정</button>
        <button class="btn btn-danger btn-sm" onclick="Pages.deleteLab(${l.id})">삭제</button>
      </div>`).join('') || `<div style="color:var(--gray-400);font-size:12px;padding:4px 0">없음</div>`;

    const prosRows = (s.prostheticTypes||[]).map((p,i) => `
      <div class="s-item" draggable="true" data-list="prosthetics" data-idx="${i}">
        ${handle}
        <div class="name">${p}</div>
        <button class="btn btn-secondary btn-sm" onclick="Pages.editProstheticModal(${i})">수정</button>
        <button class="btn btn-danger btn-sm" onclick="Pages.deleteProstheticType(${i})">삭제</button>
      </div>`).join('') || `<div style="color:var(--gray-400);font-size:12px;padding:4px 0">없음</div>`;

    return `<div class="card" style="margin-top:16px">
      <div class="s-banner-grid" style="padding:0">
        <div>
          <div class="card-header" style="margin-bottom:10px">
            <div class="card-title">🏭 기공소 관리</div>
            <button class="btn btn-primary btn-sm" onclick="Pages.addLabModal()">+ 추가</button>
          </div>
          ${labRows}
        </div>
        <div>
          <div class="card-header" style="margin-bottom:10px">
            <div class="card-title">🦷 보철 종류</div>
            <button class="btn btn-primary btn-sm" onclick="Pages.addProstheticTypeModal()">+ 추가</button>
          </div>
          ${prosRows}
        </div>
      </div>
    </div>`;
  },

  // 직원 탭 하단에 표시되는 거래처 관리 블록
  _staffVendorBlock(cat, title) {
    const handle = `<span class="drag-handle" title="드래그해서 순서 변경">⠿</span>`;
    const allVendors = DB.getVendors();
    const vendors = allVendors.map((v,gi) => ({...v, _gi: gi})).filter(v => v.category === cat);
    const rows = vendors.map((v,i) => `
      <div class="s-item" draggable="true" data-list="vendors_${cat}" data-idx="${i}" data-vid="${v.id}" data-gidx="${v._gi}">
        ${handle}
        <div class="name">${v.name}</div>
        <div class="sub">${v.contact||''}</div>
        <button class="btn btn-secondary btn-sm" onclick="Pages.editVendorModal(${v.id})">수정</button>
        <button class="btn btn-danger btn-sm" onclick="Pages.deleteVendor(${v.id})">삭제</button>
      </div>`).join('') || `<div style="color:var(--gray-400);font-size:12px;padding:4px 0">등록된 거래처 없음</div>`;
    return `<div class="card" style="margin-top:16px">
      <div class="card-header">
        <div class="card-title">🏢 ${title}</div>
        <button class="btn btn-primary btn-sm" onclick="Pages.addVendorModal(null,'${cat}')">+ 추가</button>
      </div>
      ${rows}
    </div>`;
  },

};

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
(async () => {
  await Auth.restore(); // 토큰 있으면 복원 → _showApp() 내부에서 DB.loadAll() 호출
})();
</script>
</body>
</html>
