<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조이치과 관리 시스템</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --sidebar-w: 220px;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-400: #9ca3af;
    --gray-600: #4b5563;
    --gray-800: #1f2937;
    --red: #ef4444;
    --red-light: #fef2f2;
    --green: #16a34a;
    --green-light: #f0fdf4;
    --yellow: #d97706;
    --yellow-light: #fffbeb;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.1);
    --shadow-md: 0 4px 12px rgba(0,0,0,.12);
  }

  body { font-family: 'Segoe UI', -apple-system, sans-serif; background: var(--gray-50); color: var(--gray-800); display: flex; min-height: 100vh; font-size: 14px; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: var(--sidebar-w); min-height: 100vh; background: #1e3a5f;
    color: #fff; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; z-index: 100;
  }
  #sidebar .logo { padding: 20px 16px 16px; font-size: 15px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,.12); line-height: 1.4; }
  #sidebar .logo span { font-size: 11px; font-weight: 400; opacity: .7; display: block; margin-top: 2px; }
  #sidebar nav { flex: 1; padding: 8px 0; overflow-y: auto; }
  #sidebar nav .section-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; opacity: .45; padding: 14px 16px 4px; }
  #sidebar nav a {
    display: flex; align-items: center; gap: 9px; padding: 9px 16px;
    color: rgba(255,255,255,.75); text-decoration: none; font-size: 13.5px; cursor: pointer;
    transition: background .15s, color .15s; border-radius: 0;
  }
  #sidebar nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
  #sidebar nav a.active { background: var(--primary); color: #fff; }
  #sidebar nav a .icon { font-size: 16px; width: 20px; text-align: center; }
  #sidebar .footer { padding: 12px 16px; font-size: 11px; opacity: .4; border-top: 1px solid rgba(255,255,255,.1); }

  /* ── MAIN ── */
  #main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  #topbar { background: #fff; border-bottom: 1px solid var(--gray-200); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
  #topbar h1 { font-size: 18px; font-weight: 600; }
  #topbar .month-nav { display: flex; align-items: center; gap: 8px; }
  #topbar .month-nav button { background: var(--gray-100); border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #topbar .month-nav button:hover { background: var(--gray-200); }
  #topbar .month-nav span { font-weight: 600; min-width: 80px; text-align: center; }

  #content { padding: 24px; flex: 1; }

  /* ── CARDS ── */
  .card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .card-title { font-size: 15px; font-weight: 600; }

  /* ── STAT CARDS ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
  .stat-card .label { font-size: 12px; color: var(--gray-600); margin-bottom: 6px; }
  .stat-card .value { font-size: 22px; font-weight: 700; }
  .stat-card .sub { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
  .stat-card.blue .value { color: var(--primary); }
  .stat-card.red .value { color: var(--red); }
  .stat-card.green .value { color: var(--green); }
  .stat-card.yellow .value { color: var(--yellow); }

  /* ── TABLES ── */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--gray-50); padding: 9px 10px; text-align: left; font-weight: 600; color: var(--gray-600); border-bottom: 1px solid var(--gray-200); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--gray-100); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gray-50); }
  .tbl-empty { text-align: center; padding: 40px; color: var(--gray-400); font-size: 13px; }

  /* ── BUTTONS ── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: background .15s; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--gray-100); color: var(--gray-800); }
  .btn-secondary:hover { background: var(--gray-200); }
  .btn-danger { background: var(--red-light); color: var(--red); }
  .btn-danger:hover { background: #fecaca; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-ghost { background: none; color: var(--gray-600); border: 1px solid var(--gray-200); }
  .btn-ghost:hover { background: var(--gray-100); }

  /* ── BADGES ── */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .badge-blue { background: #dbeafe; color: #1d4ed8; }
  .badge-green { background: #dcfce7; color: #15803d; }
  .badge-red { background: #fee2e2; color: #dc2626; }
  .badge-orange { background: #fed7aa; color: #c2410c; }
  .badge-green  { background: #bbf7d0; color: #15803d; }
  .status-order    { background: #fff7ed; border-left: 3px solid #f97316; }
  .status-received { background: #f0fdf4; border-left: 3px solid #22c55e; }
  .badge-yellow { background: #fef9c3; color: #854d0e; }
  .badge-gray { background: var(--gray-100); color: var(--gray-600); }

  /* ── FORMS ── */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 12px; font-weight: 600; color: var(--gray-600); }
  .form-group input, .form-group select, .form-group textarea {
    padding: 8px 10px; border: 1px solid var(--gray-200); border-radius: 6px;
    font-size: 13px; font-family: inherit; background: #fff;
    transition: border-color .15s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1);
  }
  .form-group textarea { resize: vertical; min-height: 70px; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--gray-100); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal { background: #fff; border-radius: 10px; padding: 24px; width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-md); }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
  .modal-title small { font-size: 12px; font-weight: 400; color: var(--gray-400); margin-left: 6px; }

  /* ── TABS ── */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--gray-200); margin-bottom: 20px; }
  .tab { padding: 8px 16px; cursor: pointer; border: none; background: none; font-size: 13.5px; color: var(--gray-600); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab:hover:not(.active) { color: var(--gray-800); }

  /* ── FILTER BAR ── */
  .filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-bar select, .filter-bar input { padding: 7px 10px; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 13px; background: #fff; }

  /* ── STOCK INDICATOR ── */
  .stock-ok { color: var(--green); font-weight: 600; }
  .stock-low { color: var(--yellow); font-weight: 600; }
  .stock-zero { color: var(--red); font-weight: 600; }

  /* ── ALERTS ── */
  .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
  .alert-warning { background: var(--yellow-light); color: #92400e; border-left: 3px solid var(--yellow); }
  .alert-info { background: var(--primary-light); color: #1e40af; border-left: 3px solid var(--primary); }

  /* ── PROGRESS ── */
  .progress-bar { background: var(--gray-200); border-radius: 99px; height: 6px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; background: var(--primary); }

  /* ── SETTINGS BANNERS ── */
  .s-banner { margin-bottom: 20px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .s-banner-hd { padding: 11px 18px; font-weight: 700; font-size: 13.5px; color: #fff; display: flex; align-items: center; gap: 8px; }
  .s-banner-hd.blue  { background: #1d4ed8; }
  .s-banner-hd.green { background: #15803d; }
  .s-banner-hd.purple{ background: #6d28d9; }
  .s-banner-hd.orange{ background: #b45309; }
  .s-banner-hd.dark  { background: #374151; }
  .s-banner-bd { background: #fff; padding: 16px; }
  .s-banner-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .s-block { border: 1px solid var(--gray-200); border-radius: 6px; overflow: hidden; }
  .s-block-hd { background: var(--gray-50); padding: 8px 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--gray-200); }
  .s-block-hd .title { font-weight: 600; font-size: 13px; flex: 1; }
  .s-block-bd { padding: 10px 12px; }
  .s-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 5px; }
  .s-item:hover { background: var(--gray-50); }
  .s-item .name { flex: 1; font-size: 13px; }
  .s-item .sub  { font-size: 11px; color: var(--gray-400); min-width: 70px; }
  .drag-handle { cursor: grab; color: var(--gray-300); font-size: 16px; line-height: 1; padding: 0 2px; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  .s-item.drag-over { border: 2px dashed var(--primary); background: #eff6ff; }
  .s-item.dragging { opacity: 0.4; }
  .s-block-drag { cursor: grab; color: var(--gray-400); font-size: 14px; padding: 0 4px; user-select: none; }
  .s-block-drag:active { cursor: grabbing; }
  .s-block-wrap.drag-over { outline: 2px dashed var(--primary); border-radius: 6px; }
  .s-block-wrap.dragging { opacity: 0.4; }

  .hidden { display: none !important; }

  /* ── MISC ── */
  .text-right { text-align: right; }
  .text-center { text-align: center; }
  .font-mono { font-family: monospace; }
  .amount { font-weight: 600; font-size: 13px; }
  .divider { border: none; border-top: 1px solid var(--gray-100); margin: 16px 0; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

  /* ── COMPANY COLORS ── */
  .co-ostem { color: #0ea5e9; }
  .co-neo { color: #8b5cf6; }
  .co-straumann { color: #f59e0b; }

  /* ── REPORT ── */
  .report-section { margin-bottom: 24px; }
  .report-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--gray-100); }
  .report-row:last-child { border-bottom: none; }
  .report-total { font-weight: 700; font-size: 15px; padding-top: 12px; border-top: 2px solid var(--gray-200) !important; border-bottom: none !important; }

  /* Settings page */
  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--gray-50); border-radius: 6px; }
  .item-row span { flex: 1; font-size: 13px; }

  /* ── LOGIN ── */
  #login-screen {
    position: fixed; inset: 0; background: #0f172a;
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #login-screen.hidden { display: none; }
  .login-box {
    background: #fff; border-radius: 14px; padding: 40px 36px; width: 100%; max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .login-logo { font-size: 28px; font-weight: 800; color: #1e3a5f; margin-bottom: 4px; white-space: nowrap; justify-content: center; }
  .login-sub  { font-size: 13px; color: var(--gray-400); margin-bottom: 32px; text-align: center; }
  .login-role-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .login-role-btn {
    flex: 1; padding: 10px; border-radius: 8px; border: 2px solid var(--gray-200);
    background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--gray-600);
    transition: all .15s;
  }
  .login-role-btn.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
  .login-err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }
  #login-screen .footer-info { font-size: 11px; color: var(--gray-400); text-align: center; margin-top: 24px; }

  /* ── TOPBAR role badge ── */
  .role-badge { font-size: 11px; padding: 3px 10px; border-radius: 99px; font-weight: 600; }
  .role-badge.admin { background: #fef3c7; color: #92400e; }
  .role-badge.staff { background: #dcfce7; color: #15803d; }

  /* ── HAMBURGER ── */
  #sidebar-toggle { display: none; background: none; border: none; cursor: pointer; padding: 6px; border-radius: 6px; color: var(--gray-800); }
  #sidebar-toggle:hover { background: var(--gray-100); }
  #sidebar-toggle svg { display: block; }
  #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 99; }

  /* ── MOBILE ── */
  @media (max-width: 768px) {
    /* 사이드바: 슬라이드 드로어 */
    #sidebar {
      transform: translateX(-100%);
      transition: transform .25s ease;
      z-index: 200;
    }
    #sidebar.mobile-open { transform: translateX(0); }
    #sidebar-overlay.mobile-open { display: block; }
    #sidebar-toggle { display: flex; align-items: center; justify-content: center; }

    /* 메인: 전체 너비 */
    #main { margin-left: 0; }

    /* 탑바 */
    #topbar { padding: 10px 14px; gap: 8px; }
    #topbar h1 { font-size: 15px; }
    #topbar .month-nav button { padding: 4px 8px; font-size: 12px; }
    #topbar .month-nav span { min-width: 64px; font-size: 12px; }
    .role-badge { display: none; }

    /* 콘텐츠 */
    #content { padding: 12px; }

    /* 스탯 카드: 2열 */
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-card .value { font-size: 17px; }

    /* 2열 레이아웃 → 1열 */
    .two-col { grid-template-columns: 1fr; }

    /* 모달: 하단 시트 스타일 */
    .modal-overlay { align-items: flex-end; padding: 0; }
    .modal {
      border-radius: 14px 14px 0 0;
      max-height: 92vh;
      max-width: 100%;
      padding: 20px 16px;
    }

    /* 폼 그리드: 1열 */
    .form-grid { grid-template-columns: 1fr !important; }

    /* 탭: 스크롤 가능 */
    .tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
    .tab { white-space: nowrap; padding: 8px 12px; font-size: 12.5px; }

    /* 필터바 */
    .filter-bar { gap: 6px; }
    .filter-bar select, .filter-bar input { font-size: 12px; padding: 6px 8px; }

    /* 로그인 박스 */
    .login-box { border-radius: 14px; padding: 32px 24px; }
    .login-logo { font-size: 22px; }

    /* 카드 */
    .card { padding: 14px; }

    /* 테이블 버튼 크기 */
    .btn-sm { padding: 4px 8px; font-size: 11px; }

    /* 설정 그리드 */
    .settings-grid { grid-template-columns: 1fr; }
    .s-banner-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo" style="display:flex;align-items:center;gap:12px"><img src="joydentallogo.png" style="height:56px;object-fit:contain">조이치과 관리 시스템</div>
    <div class="login-sub">Joy Dental Clinic Management System</div>
    <div class="login-role-tabs">
      <button class="login-role-btn active" onclick="Auth.selectRole('admin',this)">👨‍⚕️ 원장</button>
      <button class="login-role-btn" onclick="Auth.selectRole('staff',this)">👩‍💼 직원</button>
    </div>
    <div class="form-group" id="login-pw-group">
      <label>비밀번호</label>
      <input type="password" id="login-pw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')Auth.doLogin()">
    </div>
    <div class="login-err" id="login-err"></div>
    <button class="btn btn-primary login-submit-btn" style="width:100%;margin-top:16px;padding:11px" onclick="Auth.doLogin()">로그인</button>
    <div style="text-align:center;margin-top:12px">
      <button onclick="Auth.showForgotPassword()" style="background:none;border:none;color:var(--gray-400);font-size:12px;cursor:pointer;text-decoration:underline">비밀번호를 잊으셨나요?</button>
    </div>
  </div>
</div>

<!-- SIDEBAR OVERLAY (모바일) -->
<div id="sidebar-overlay" onclick="App.closeSidebar()"></div>

<!-- SIDEBAR -->
<div id="sidebar" class="hidden">
  <div class="logo" id="sidebar-logo" style="display:flex;align-items:center;gap:10px"><img src="joydentallogo.png" style="height:36px;object-fit:contain;flex-shrink:0"><span>조이치과 관리 시스템<span id="sidebar-sub" style="display:block">로딩 중...</span></span></div>
  <nav id="nav"></nav>
  <div class="footer">v1.0 · 데이터는 브라우저에 저장됩니다</div>
</div>

<!-- MAIN -->
<div id="main" class="hidden">
  <div id="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button id="sidebar-toggle" onclick="App.toggleSidebar()" aria-label="메뉴">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 id="page-title">대시보드</h1>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="month-nav">
        <button onclick="App.prevMonth()">◀</button>
        <span id="month-label"></span>
        <button onclick="App.nextMonth()">▶</button>
      </div>
      <span id="role-badge" class="role-badge"></span>
      <button class="btn btn-ghost btn-sm" onclick="Auth.logout()">로그아웃</button>
    </div>
  </div>

  <div id="content"></div>
</div>

<!-- MODAL CONTAINER -->
<div id="modal-container"></div>

<script>
// ═══════════════════════════════════════════════════════════
// DATA LAYER
// ═══════════════════════════════════════════════════════════
// ── 서버 API URL ─────────────────────────────────────────────
// Railway 배포 후 이 값을 실제 URL로 변경하세요.
// 예: 'https://joydental-production.up.railway.app'
// 로컬 테스트: 'http://localhost:3000'
// 서버 없이 로컬에서만 쓸 경우: null (localStorage 전용 모드)
const SERVER_URL = 'https://joydental-server-production.up.railway.app';

const DB = {
  _cache: {},
  _serverOk: false,

  // 인증 토큰 헤더 반환
  _authHeaders() {
    const token = sessionStorage.getItem('dc_token');
    return {
      'Content-Type': 'application/json',
      ...(token ? { 'Authorization': `Bearer ${token}` } : {})
    };
  },

  // 동기 읽기 (캐시)
  _get(k) {
    if (k in this._cache) return this._cache[k];
    try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; }
  },

  // 동기 쓰기 (캐시 즉시 반영) + 비동기 서버 저장
  _set(k, v) {
    this._cache[k] = v;
    localStorage.setItem(k, JSON.stringify(v));
    if (this._serverOk && SERVER_URL) {
      fetch(`${SERVER_URL}/api/data/${k}`, {
        method: 'POST',
        headers: this._authHeaders(),
        body: JSON.stringify(v)
      }).catch(err => console.warn('서버 저장 실패 (로컬 백업됨):', err));
    }
  },

  // 로그인 후 서버에서 전체 데이터 로드
  async loadAll() {
    if (!SERVER_URL) {
      console.log('로컬 모드: localStorage 사용 중');
      return;
    }
    try {
      const res = await fetch(`${SERVER_URL}/api/data`, {
        headers: this._authHeaders(),
        signal: AbortSignal.timeout(8000)
      });
      if (res.status === 401) {
        // 토큰 만료 — 로그아웃 처리
        Auth.logout();
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const { data } = await res.json();
      this._cache = data || {};
      this._serverOk = true;
      console.log('✅ 서버 연결 성공 — 데이터 로드 완료');
    } catch (err) {
      console.warn('⚠️ 서버 연결 실패 — localStorage 폴백 모드:', err.message);
      this._serverOk = false;
      Object.keys(localStorage).filter(k => k.startsWith('dc_')).forEach(k => {
        try { this._cache[k] = JSON.parse(localStorage.getItem(k)); } catch {}
      });
    }
  },

  // --- Settings ---
  getSettings() {
    const defaults = {
      labs: [
        { id: 1, name: '기공소 A', contact: '' },
        { id: 2, name: '기공소 B', contact: '' },
        { id: 3, name: '기공소 C', contact: '' }
      ],
      directCategories: ['인건비','임대료','전기/가스','통신비','보험료','세금/공과금','기타'],
      fixtureCompanies: ['오스템', '네오', '스트라우만'],
      prostheticTypes: ['PFM 크라운','지르코니아 크라운','골드 크라운','임플란트 크라운','PFM 브릿지','지르코니아 브릿지','임플란트 보철','틀니(완전)','틀니(부분)','인레이','온레이','Laminate','기타'],
      implantMatCategories: [
        { name: '힐링 어버트먼트', trackInventory: false },
        { name: '커버스크류',      trackInventory: true  },
        { name: '골이식재',        trackInventory: true  },
        { name: '차폐막',          trackInventory: true  },
        { name: '기타 수술 재료',  trackInventory: true  },
        { name: '임프레션 코핑',   trackInventory: false },
        { name: '아날로그',        trackInventory: false },
      ],
      nextId: { lab: 4 }
    };
    const saved = this._get('dc_settings');
    if (!saved) return defaults;
    // 새 키 누락 보완
    if (!saved.labs) saved.labs = defaults.labs;
    if (!saved.directCategories) saved.directCategories = defaults.directCategories;
    if (!saved.fixtureCompanies) saved.fixtureCompanies = defaults.fixtureCompanies;
    if (!saved.prostheticTypes) saved.prostheticTypes = defaults.prostheticTypes;
    if (!saved.implantMatCategories) saved.implantMatCategories = defaults.implantMatCategories;
    return saved;
  },
  saveSettings(s) { this._set('dc_settings', s); },

  // --- Fixture Items (픽스쳐 마스터) ---
  getFixtures() { return this._get('dc_fixtures') || []; },
  saveFixtures(d) { this._set('dc_fixtures', d); },

  // --- Implant Material Items ---
  getImplantMaterials() { return this._get('dc_implant_mats') || []; },
  saveImplantMaterials(d) { this._set('dc_implant_mats', d); },

  // --- Fixture Usage ---
  getFixtureUsage() { return this._get('dc_fixture_usage') || []; },
  saveFixtureUsage(d) { this._set('dc_fixture_usage', d); },

  // --- Implant Material Usage ---
  getMatUsage() { return this._get('dc_mat_usage') || []; },
  saveMatUsage(d) { this._set('dc_mat_usage', d); },

  // --- Implant Orders (입고) ---
  getImplantOrders() { return this._get('dc_implant_orders') || []; },
  saveImplantOrders(d) { this._set('dc_implant_orders', d); },

  // --- General Dental Material Orders ---
  getGeneralOrders() { return this._get('dc_general_orders') || []; },
  saveGeneralOrders(d) { this._set('dc_general_orders', d); },

  // --- Lab Work ---
  getLabWork() { return this._get('dc_lab_work') || []; },
  saveLabWork(d) { this._set('dc_lab_work', d); },

  // --- Direct Expenses ---
  getDirectExpenses() { return this._get('dc_direct') || []; },
  saveDirectExpenses(d) { this._set('dc_direct', d); },

  // --- Vendors ---
  getVendors() { return this._get('dc_vendors') || []; },
  saveVendors(d) { this._set('dc_vendors', d); },

  // --- ID Generator ---
  nextId(prefix) {
    const k = 'dc_id_' + prefix;
    const n = (this._get(k) || 0) + 1;
    this._set(k, n);
    return n;
  }
};

// AUTH — 서버 기반 JWT 로그인
// ═══════════════════════════════════════════════════════════
const Auth = {
  _SK: 'dc_session',
  _TK: 'dc_token',
  _role: null,
  _selectedRole: 'admin',

  getRole()    { return this._role; },
  isAdmin()    { return this._role === 'admin'; },
  isLoggedIn() { return !!this._role; },

  selectRole(role, btn) {
    this._selectedRole = role;
    document.querySelectorAll('.login-role-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('login-pw').placeholder = '비밀번호 입력';
    document.getElementById('login-err').textContent = '';
  },

  async doLogin() {
    const role = this._selectedRole;
    const pw   = document.getElementById('login-pw').value;
    const btn  = document.querySelector('.login-submit-btn');
    if (btn) { btn.disabled = true; btn.textContent = '로그인 중...'; }

    try {
      if (SERVER_URL) {
        // 서버 로그인
        const res = await fetch(`${SERVER_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role, password: pw }),
          signal: AbortSignal.timeout(8000)
        });
        const data = await res.json();
        if (!data.ok) {
          document.getElementById('login-err').textContent = data.error || '로그인 실패';
          return;
        }
        sessionStorage.setItem(this._TK, data.token);
        this._role = data.role;
      } else {
        // 로컬 폴백 (서버 없을 때)
        const creds = DB.getSettings().credentials || { adminPassword: '1234', staffPassword: '' };
        if (role === 'admin' && pw !== creds.adminPassword) {
          document.getElementById('login-err').textContent = '비밀번호가 틀렸습니다.';
          return;
        }
        if (role === 'staff' && creds.staffPassword && pw !== creds.staffPassword) {
          document.getElementById('login-err').textContent = '비밀번호가 틀렸습니다.';
          return;
        }
        this._role = role;
      }
      sessionStorage.setItem(this._SK, this._role);
      await this._showApp();
    } catch (err) {
      document.getElementById('login-err').textContent = '서버 연결 실패. 잠시 후 다시 시도하세요.';
      console.error('로그인 오류:', err);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '로그인'; }
    }
  },

  logout() {
    this._role = null;
    sessionStorage.removeItem(this._SK);
    sessionStorage.removeItem(this._TK);
    DB._cache = {};
    DB._serverOk = false;
    document.getElementById('login-pw').value = '';
    document.getElementById('login-err').textContent = '';
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('main').classList.add('hidden');
  },

  // 세션 복원 (페이지 새로고침 시)
  async restore() {
    const savedRole  = sessionStorage.getItem(this._SK);
    const savedToken = sessionStorage.getItem(this._TK);
    if ((savedRole === 'admin' || savedRole === 'staff') && savedToken) {
      this._role = savedRole;
      await this._showApp();
    }
  },

  // ── 비밀번호 찾기 ──────────────────────────────────────────
  showForgotPassword() {
    const overlay = document.createElement('div');
    overlay.id = 'forgot-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999';
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:12px;padding:32px;width:360px;max-width:90vw">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:6px">비밀번호 찾기</h3>
        <p style="font-size:13px;color:var(--gray-600);margin-bottom:20px">관리자 메일로 인증코드를 발송합니다.</p>

        <div id="fp-step1">
          <div style="margin-bottom:12px">
            <label style="font-size:13px;font-weight:500;display:block;margin-bottom:6px">변경할 계정</label>
            <select id="fp-role" style="width:100%;padding:8px 10px;border:1px solid var(--gray-200);border-radius:6px;font-size:13px">
              <option value="admin">원장 (관리자)</option>
              <option value="staff">직원</option>
            </select>
          </div>
          <button onclick="Auth._sendCode()" class="btn btn-primary" style="width:100%;padding:10px">인증코드 발송</button>
        </div>

        <div id="fp-step2" style="display:none">
          <div style="margin-bottom:12px">
            <label style="font-size:13px;font-weight:500;display:block;margin-bottom:6px">인증코드 (6자리)</label>
            <input id="fp-code" type="text" maxlength="6" placeholder="000000"
              style="width:100%;padding:8px 10px;border:1px solid var(--gray-200);border-radius:6px;font-size:20px;letter-spacing:6px;text-align:center">
          </div>
          <div style="margin-bottom:16px">
            <label style="font-size:13px;font-weight:500;display:block;margin-bottom:6px">새 비밀번호</label>
            <input id="fp-newpw" type="password" placeholder="새 비밀번호 입력"
              style="width:100%;padding:8px 10px;border:1px solid var(--gray-200);border-radius:6px;font-size:13px">
          </div>
          <button onclick="Auth._confirmReset()" class="btn btn-primary" style="width:100%;padding:10px">비밀번호 변경</button>
        </div>

        <div id="fp-msg" style="margin-top:12px;font-size:13px;text-align:center;color:var(--red)"></div>
        <button onclick="document.getElementById('forgot-overlay').remove()"
          style="width:100%;margin-top:12px;background:none;border:none;color:var(--gray-400);font-size:13px;cursor:pointer">취소</button>
      </div>`;
    document.body.appendChild(overlay);
  },

  async _sendCode() {
    const msg = document.getElementById('fp-msg');
    const btn = document.querySelector('#fp-step1 button');
    msg.style.cssText = 'margin-top:12px;font-size:13px;text-align:center;color:var(--gray-600)';
    msg.textContent = '발송 중...';
    if (btn) btn.disabled = true;
    try {
      const res  = await fetch(`${SERVER_URL}/api/forgot-password`, {
        method: 'POST',
        signal: AbortSignal.timeout(20000)
      });
      const data = await res.json();
      if (!data.ok) {
        msg.style.color = 'var(--red)';
        msg.style.fontWeight = '600';
        msg.textContent = '❌ ' + (data.error || '발송 실패');
        if (btn) btn.disabled = false;
        return;
      }
      msg.style.color = 'var(--green)';
      msg.textContent = '✅ ' + data.message;
      document.getElementById('fp-step1').style.display = 'none';
      document.getElementById('fp-step2').style.display = 'block';
    } catch (err) {
      msg.style.color = 'var(--red)';
      msg.style.fontWeight = '600';
      msg.textContent = '❌ ' + (err.name === 'TimeoutError' ? '서버 응답 시간 초과' : '연결 실패: ' + err.message);
      if (btn) btn.disabled = false;
    }
  },

  async _confirmReset() {
    const code      = document.getElementById('fp-code').value.trim();
    const newPassword = document.getElementById('fp-newpw').value;
    const role      = document.getElementById('fp-role').value;
    const msg       = document.getElementById('fp-msg');

    if (!code || !newPassword) { msg.style.color='var(--red)'; msg.textContent='모두 입력해주세요.'; return; }
    if (newPassword.length < 4) { msg.style.color='var(--red)'; msg.textContent='비밀번호는 4자 이상이어야 합니다.'; return; }

    msg.style.color = 'var(--gray-600)';
    msg.textContent = '변경 중...';
    try {
      const res  = await fetch(`${SERVER_URL}/api/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, newPassword, role })
      });
      const data = await res.json();
      if (!data.ok) { msg.style.color='var(--red)'; msg.textContent = data.error; return; }
      msg.style.color = 'var(--green)';
      msg.textContent = '변경 완료! 새 비밀번호로 로그인하세요.';
      setTimeout(() => document.getElementById('forgot-overlay')?.remove(), 2000);
    } catch {
      msg.style.color = 'var(--red)';
      msg.textContent = '서버 연결 실패';
    }
  },

  async _showApp() {
    // 로그인 후 서버에서 데이터 로드
    await DB.loadAll();

    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('sidebar').classList.remove('hidden');
    document.getElementById('main').classList.remove('hidden');
    const badge = document.getElementById('role-badge');
    badge.textContent = this._role === 'admin' ? '👨‍⚕️ 원장' : '👩‍💼 직원';
    badge.className = 'role-badge ' + this._role;
    document.getElementById('sidebar-sub').textContent =
      this._role === 'admin' ? '지출·재고 통합 관리' : '재료·기공 관리';
    App.renderNav();
    App.renderCurrentPage();
  }
};

const fmt = {
  won(n) { return (n || 0).toLocaleString('ko-KR') + '원'; },
  date(s) { if (!s) return ''; const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; },
  dateFull(s) { if (!s) return ''; return s.replace(/-/g, '.'); },
  ym(y, m) { return `${y}년 ${m}월`; },
};

function ym(y, m) { return `${y}-${String(m).padStart(2,'0')}`; }
function inMonth(dateStr, y, m) { return dateStr && dateStr.startsWith(ym(y, m)); }

function today() { return new Date().toISOString().slice(0, 10); }

function sum(arr, fn) { return arr.reduce((a, b) => a + (fn(b) || 0), 0); }

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function showModal(html) {
  const c = document.getElementById('modal-container');
  c.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">${html}</div>`;
}
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

let _confirmCb = null;
function confirm2(msg, cb) {
  _confirmCb = cb;
  showModal(`<div class="modal" style="max-width:360px">
    <div class="modal-title">확인</div>
    <p style="font-size:14px;margin-bottom:20px">${msg}</p>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal()">취소</button>
      <button class="btn btn-danger" onclick="closeModal();if(_confirmCb){_confirmCb();_confirmCb=null;}">삭제</button>
    </div>
  </div>`);
}

let _smsCb = null;
function smsConfirm(previewText, cb) {
  _smsCb = cb;
  const escaped = previewText.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  showModal(`<div class="modal" style="max-width:420px">

    <div style="background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:12px 14px;font-size:13px;white-space:pre-wrap;color:var(--gray-800);margin-bottom:20px;line-height:1.7">${escaped}</div>
    <div class="form-actions">

function sendSms(phone, text) {
  fetch(`${SERVER_URL}/api/sms`, {
    method: 'POST',
    headers: { ...DB._authHeaders(), 'Content-Type': 'application/json' },

  }).then(r => r.json()).then(r => {

      if (item.section) return `<div class="section-label">${item.section}</div>`;

    document.getElementById('sidebar').classList.toggle('mobile-open');

  },
  closeSidebar() {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sidebar-overlay').classList.remove('mobile-open');
  },

  prevMonth() {
    if (this.month === 1) { this.month = 12; this.year--; }
    else this.month--;
    this.renderCurrentPage();

  nextMonth() {

    else this.month++;

      dashboard: '대시보드', direct: '직접 지출',
      implant: Auth.isAdmin() ? '임플란트 재료' : '임플란트 재료 관리',
      general: '일반 치과재료 및 의약품',
      lab: Auth.isAdmin() ? '기공 의뢰' : '기공 의뢰 관리',
      report: '월별 리포트', settings: '설정'
    };
    document.getElementById('page-title').textContent = titles[page] || page;
    this.renderCurrentPage();
  },

  renderCurrentPage() {
    if (!Auth.isLoggedIn()) return;
    document.getElementById('month-label').textContent = fmt.ym(this.year, this.month);
    // 기본 페이지 설정
    if (!this.page) this.page = Auth.isAdmin() ? 'dashboard' : 'implant';
    const map = {
      dashboard: Pages.dashboard, direct: Pages.direct,
      implant: Pages.implant,     general: Pages.general,
      lab: Pages.lab,             report: Pages.report,
      settings: Pages.settings
    };
    // 직원이 원장 전용 페이지 접근 차단
    const adminOnly = ['dashboard','direct','report','settings'];
    if (!Auth.isAdmin() && adminOnly.includes(this.page)) this.page = 'implant';
    const fn = map[this.page];
    if (fn) fn.call(Pages, this.year, this.month);
    this.renderNav();
  }
};

// PAGES

const Pages = {

  // ─── DASHBOARD ───
  dashboard(y, m) {
    const direct = DB.getDirectExpenses().filter(r => inMonth(r.date, y, m));
    const implantOrders = DB.getImplantOrders().filter(r => inMonth(r.date, y, m));
    const generalOrders = DB.getGeneralOrders().filter(r => inMonth(r.date, y, m));
    const labWork = DB.getLabWork().filter(r => inMonth(r.date, y, m));
    const allFixtures = DB.getFixtures();
    const allMats = DB.getImplantMaterials();
    const fixtureUsage = DB.getFixtureUsage().filter(r => inMonth(r.date, y, m));
    const matUsage = DB.getMatUsage().filter(r => inMonth(r.date, y, m));

    const totalDirect = sum(direct, r => r.amount);

    // ── 임플란트 재료 주문액 (발주 기준, 반품완료 품목 제외) ──
    const totalImplantOrder = sum(implantOrders.filter(r => r.item_status !== '반품완료'), r => r.total);

    // ── 임플란트 재료 사용액 (사용 기록 기준, 페일 반품완료 제외) ──
    const fixtureCost = sum(
      fixtureUsage.filter(r => !(r.fail && r.return_status === '반품 완료')),
      r => { const f = allFixtures.find(x => x.id === r.fixture_id); return (f?.unit_price||0) * r.quantity; }
    );
    const matCost = sum(matUsage, r => { const mt = allMats.find(x => x.id === r.mat_id); return (mt?.unit_price||0) * r.quantity; });
    const totalImplantUsage = fixtureCost + matCost;

    const getGIST = r => r.item_status !== undefined ? r.item_status
      : (r.status === '반품' ? '반품완료' : r.status === '입고확인' ? '입고확인' : '');
    const totalGeneral = sum(generalOrders.filter(r => getGIST(r) !== '반품완료'), r => r.total_amount||r.amount||0);
    const totalLab = sum(labWork, r => r.amount);
    const grandTotal = totalDirect + totalImplantOrder + totalGeneral + totalLab;

    // Low stock alerts
    const fixtures = DB.getFixtures().filter(f => f.stock <= (f.min_stock || 2));
    const mats = DB.getImplantMaterials().filter(m2 => isTrackInventory(m2.category) && m2.stock <= (m2.min_stock || 1));

    let alerts = '';
    if (fixtures.length || mats.length) {
      const items = [...fixtures.map(f => `[${f.company}] ${f.diameter}×${f.length} (재고: ${f.stock}개)`),
                     ...mats.map(m2 => `${m2.name} (재고: ${m2.stock}${m2.unit||'개'})`)];
      alerts = `<div class="alert alert-warning">⚠️ 재고 부족 알림: ${items.join(', ')}</div>`;
    }

    // Recent entries (last 7)
    const allRecent = [
      ...direct.map(r => ({ date: r.date, label: `직접지출 · ${r.category}`, name: r.description, amount: r.amount })),
      ...implantOrders.filter(r => r.item_status !== '반품완료').map(r => ({ date: r.date, label: '임플란트 입고', name: r.item_name, amount: r.total })),
      ...generalOrders.filter(r => r.status !== '반품').map(r => ({ date: r.date, label: '일반 재료', name: r.description, amount: r.total_amount||r.amount||0 })),
      ...labWork.map(r => ({ date: r.date, label: `기공[${r.lab_name}]`, name: `${r.patient_name} · ${r.prosthetic_type}`, amount: r.amount })),
    ].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 10);

    const recentRows = allRecent.length
      ? allRecent.map(r => `<tr>
          <td>${fmt.date(r.date)}</td>
          <td><span class="badge badge-gray">${r.label}</span></td>
          <td>${r.name}</td>
          <td class="text-right amount">${fmt.won(r.amount)}</td>
        </tr>`).join('')
      : `<tr><td colspan="4" class="tbl-empty">이번 달 기록이 없습니다</td></tr>`;

    // Chart bar (주문액 기준)
    const maxVal = Math.max(totalDirect, totalImplantOrder, totalGeneral, totalLab, 1);
    const bars = [
      { label: '직접지출', val: totalDirect, color: '#2563eb' },
      { label: '임플란트주문', val: totalImplantOrder, color: '#7c3aed' },
      { label: '일반재료', val: totalGeneral, color: '#0891b2' },
      { label: '기공의뢰', val: totalLab, color: '#d97706' },
    ].map(b => `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="font-size:11px;color:var(--gray-600);font-weight:600">${fmt.won(b.val)}</div>
        <div style="width:100%;background:var(--gray-100);border-radius:6px;height:120px;display:flex;align-items:flex-end;overflow:hidden">
          <div style="width:100%;height:${Math.round(b.val/maxVal*100)}%;background:${b.color};border-radius:4px 4px 0 0;transition:height .3s"></div>
        </div>
        <div style="font-size:11px;color:var(--gray-600)">${b.label}</div>
      </div>`).join('');

    document.getElementById('content').innerHTML = `
      ${alerts}
      <div class="stats-grid">
        <div class="stat-card blue"><div class="label">이달 총 지출</div><div class="value">${fmt.won(grandTotal)}</div><div class="sub">${fmt.ym(y,m)}</div></div>
        <div class="stat-card"><div class="label">직접 지출</div><div class="value" style="font-size:18px">${fmt.won(totalDirect)}</div></div>
        <div class="stat-card" style="border-left:3px solid #7c3aed">
          <div class="label">임플란트 재료 주문액</div><div class="value" style="font-size:18px">${fmt.won(totalImplantOrder)}</div>
          <div class="sub">발주 기준</div>
        </div>
        <div class="stat-card" style="border-left:3px solid #a78bfa">
          <div class="label">임플란트 재료 사용액</div><div class="value" style="font-size:18px">${fmt.won(totalImplantUsage)}</div>
          <div class="sub">사용 기록 기준</div>
        </div>
        <div class="stat-card"><div class="label">일반 치과 재료</div><div class="value" style="font-size:18px">${fmt.won(totalGeneral)}</div></div>
        <div class="stat-card yellow"><div class="label">기공 의뢰</div><div class="value" style="font-size:18px">${fmt.won(totalLab)}</div></div>
      </div>
      <div class="two-col">
        <div class="card">
          <div class="card-header"><div class="card-title">카테고리별 비율</div></div>
          <div style="display:flex;gap:12px;height:160px;align-items:flex-end">${bars}</div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">최근 입력 내역</div></div>
          <div class="tbl-wrap"><table>
            <thead><tr><th>날짜</th><th>구분</th><th>내용</th><th class="text-right">금액</th></tr></thead>
            <tbody>${recentRows}</tbody>
          </table></div>
        </div>
      </div>`;
  },

  // ─── DIRECT EXPENSES ───
  direct(y, m) {
    const data = DB.getDirectExpenses();
    const filtered = data.filter(r => inMonth(r.date, y, m));
    const settings = DB.getSettings();
    const total = sum(filtered, r => r.amount);

    const rows = filtered.length
      ? [...filtered].sort((a,b) => b.date.localeCompare(a.date)).map(r => `<tr>
          <td>${fmt.dateFull(r.date)}</td>
          <td><span class="badge badge-gray">${r.category}</span></td>
          <td>${r.vendor || ''}</td>
          <td>${r.description || ''}</td>
          <td><span class="badge badge-blue">${r.payment}</span></td>
          <td class="text-right amount">${fmt.won(r.amount)}</td>

      : `<tr><td colspan="7" class="tbl-empty">이번 달 직접 지출 내역이 없습니다</td></tr>`;

    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">직접 지출 (카드/이체)</div>
            <div style="font-size:12px;color:var(--gray-400);margin-top:2px">이달 합계: <strong>${fmt.won(total)}</strong></div>
          </div>
          <button class="btn btn-primary" onclick="Pages.addDirectModal()">+ 지출 추가</button>
        </div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>날짜</th><th>분류</th><th>거래처</th><th>내용</th><th>결제</th><th class="text-right">금액</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>`;
  },
  addDirectModal(edit) {
    const settings = DB.getSettings();
    const cats = settings.directCategories.map(c => `<option value="${c}" ${edit?.category===c?'selected':''}>${c}</option>`).join('');
    const methods = PAYMENT_METHODS.map(p => `<option value="${p}" ${edit?.payment===p?'selected':''}>${p}</option>`).join('');
    showModal(`<div class="modal">
      <div class="modal-title">${edit ? '지출 수정' : '직접 지출 추가'}</div>
      ${vendorDatalist('vlist-direct', '기타')}
      <form onsubmit="Pages.saveDirectExpense(event,${edit?.id||'null'})">
        <div class="form-grid">
          <div class="form-group"><label>날짜</label><input type="date" name="date" value="${edit?.date||today()}" required></div>
          <div class="form-group"><label>분류</label><select name="category">${cats}</select></div>
          <div class="form-group"><label>거래처</label><input type="text" name="vendor" value="${edit?.vendor||''}" list="vlist-direct" placeholder="거래처명 입력 또는 선택"></div>
          <div class="form-group"><label>결제 방법</label><select name="payment">${methods}</select></div>
          <div class="form-group" style="grid-column:1/-1"><label>내용/메모</label><input type="text" name="description" value="${edit?.description||''}" placeholder="지출 내용"></div>
          <div class="form-group"><label>금액 (원)</label><input type="number" name="amount" value="${edit?.amount||''}" min="0" step="any" required placeholder="0" inputmode="numeric"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button>
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </form>
    </div>`);
  },
  saveDirectExpense(e, editId) {
    e.preventDefault();
    const f = new FormData(e.target);
    const data = DB.getDirectExpenses();
    if (editId) {
      const idx = data.findIndex(r => r.id === editId);
      if (idx >= 0) data[idx] = { ...data[idx], date: f.get('date'), category: f.get('category'), vendor: f.get('vendor'), description: f.get('description'), payment: f.get('payment'), amount: +f.get('amount') };
    } else {
      data.push({ id: DB.nextId('direct'), date: f.get('date'), category: f.get('category'), vendor: f.get('vendor'), description: f.get('description'), payment: f.get('payment'), amount: +f.get('amount') });
    }
    DB.saveDirectExpenses(data);
    closeModal();
    Pages.direct(App.year, App.month);
  },
  deleteDirectExpense(id) {
    confirm2('이 지출 내역을 삭제하시겠습니까?', () => {
      DB.saveDirectExpenses(DB.getDirectExpenses().filter(r => r.id !== id));
      Pages.direct(App.year, App.month);
    });
  },

  // ─── IMPLANT MATERIALS ───
  _implantTab: 'stock',
  implant(y, m) {
    const tab = Pages._implantTab;
    const tabs = [
      { id: 'stock', label: '재고 현황' },
      { id: 'usage', label: '사용 기록' },
      { id: 'orders', label: '주문 기록' },
      { id: 'returns', label: '페일 픽스쳐 관리' },
      { id: 'items', label: '품목 관리' },
    ];
    const tabsHtml = tabs.map(t => `<button class="tab ${tab===t.id?'active':''}" onclick="Pages._implantTab='${t.id}';Pages.implant(App.year,App.month)">${t.label}</button>`).join('');

    let body = '';
    if (tab === 'stock') body = Pages._implantStock();
    else if (tab === 'usage') body = Pages._implantUsage(y, m);
    else if (tab === 'orders') body = Pages._implantOrders(y, m);
    else if (tab === 'returns') body = Pages._implantReturns(y, m);
    else if (tab === 'items') body = Pages._implantItems();

    const lowFix = DB.getFixtures().filter(f => f.stock <= (f.min_stock || 2));
    const lowMat = DB.getImplantMaterials().filter(m2 => isTrackInventory(m2.category) && m2.stock <= (m2.min_stock || 1));
    let stockAlert = '';
    if (lowFix.length || lowMat.length) {
      const items = [
        ...lowFix.map(f => `[${f.company}] ${f.diameter}×${f.length}mm (재고: ${f.stock}개)`),
        ...lowMat.map(m2 => `${m2.name} (재고: ${m2.stock}${m2.unit||'개'})`),
      ];
      stockAlert = `<div class="alert alert-warning" style="margin-bottom:12px">⚠️ 재고 부족 알림: ${items.join(', ')}</div>`;
    }

    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="tabs">${tabsHtml}</div>
        ${stockAlert}
        ${body}
      </div>`;

  _implantStock() {
    const fixtures = DB.getFixtures();
    const mats = DB.getImplantMaterials();

    // Fixtures grouped by company
    const byCompany = {};
    getCompanies().forEach(c => { byCompany[c] = fixtures.filter(f => f.company === c); });

    const fixtureHtml = getCompanies().map(co => {
      const list = byCompany[co];
      if (!list.length) return `<div style="margin-bottom:16px"><strong>${co}</strong> <span style="font-size:12px;color:var(--gray-400)">— 등록된 품목 없음</span></div>`;
      const admin = Auth.isAdmin();
      const rows = list.sort((a,b) => (a.fixture_type||'').localeCompare(b.fixture_type||'')||(+a.diameter)-(+b.diameter)||(+a.length)-(+b.length)).map(f => {
        const cls = f.stock === 0 ? 'stock-zero' : f.stock <= (f.min_stock||2) ? 'stock-low' : 'stock-ok';
        return `<tr>
          <td>${f.company}</td>
          <td>${f.fixture_type ? `<span class="badge badge-gray">${f.fixture_type}</span>` : '<span style="color:var(--gray-400)">-</span>'}</td>
          <td>${f.diameter}mm</td><td>${f.length}mm</td>
          <td class="${cls} text-center">${f.stock}개</td>
          ${admin ? `<td class="text-right" style="font-size:12px;color:var(--gray-400)">${fmt.won(f.unit_price)}/개</td>` : ''}
          <td></td>
        </tr>`;
      }).join('');
      return `<div style="margin-bottom:20px">
        <div style="font-weight:600;margin-bottom:8px;color:var(--primary)">${co}</div>
        <table><thead><tr><th>제조사</th><th>종류</th><th>직경</th><th>길이</th><th class="text-center">재고</th>${admin?'<th class="text-right">단가</th>':''}<th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    }).join('');

    const admin2 = Auth.isAdmin();
    const trackedMats = mats.filter(m => isTrackInventory(m.category));
    // 분류별 그룹핑
    const matCatOrder = getImplantMatCats().filter(c => c.trackInventory).map(c => c.name);
    const matByCat = {};
    trackedMats.forEach(m => { if (!matByCat[m.category]) matByCat[m.category] = []; matByCat[m.category].push(m); });
    const catKeys = [...new Set([...matCatOrder.filter(k => matByCat[k]), ...Object.keys(matByCat)])];

    const matGroupHtml = catKeys.length ? catKeys.map(cat => {
      const items = matByCat[cat] || [];
      const catRows = items.map(m => {
        const cls = m.stock === 0 ? 'stock-zero' : m.stock <= (m.min_stock||1) ? 'stock-low' : 'stock-ok';
        const specLabel = m.spec ? `<span style="font-size:11px;color:var(--gray-400);margin-left:4px">(${m.spec})</span>` : '';
        return `<tr>
          <td>${m.name}${specLabel}</td>
          <td class="${cls} text-center">${m.stock} ${m.unit||'개'}</td>
          ${admin2 ? `<td class="text-right" style="font-size:12px;color:var(--gray-400)">${fmt.won(m.unit_price)}/${m.unit||'개'}</td>` : ''}
          <td></td>
        </tr>`;
      }).join('');
      return `<div style="margin-bottom:18px">
        <div style="font-weight:600;font-size:12px;color:var(--primary);margin-bottom:6px">${cat}</div>
        <table><thead><tr><th>품명</th><th class="text-center">재고</th>${admin2?'<th class="text-right">단가</th>':''}<th></th></tr></thead>
        <tbody>${catRows}</tbody></table>
      </div>`;
    }).join('') : `<div style="color:var(--gray-400);font-size:13px;padding:8px 0">등록된 재료가 없습니다. [품목 관리]에서 추가하세요.</div>`;

    return `
      <div class="card-header" style="padding:0;margin-bottom:16px">
        <div class="card-title">재고 현황</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary" onclick="Pages.addUsageModal()">사용 기록 추가</button>
          <button class="btn btn-primary" onclick="Pages.addOrderModal()">주문 추가</button>
        </div>
      </div>
      <div style="font-weight:600;font-size:13px;color:var(--gray-600);margin-bottom:10px">📌 픽스쳐</div>
      ${fixtureHtml}
      <hr class="divider">
      <div style="font-weight:600;font-size:13px;color:var(--gray-600);margin:16px 0 10px">📌 기타 수술 재료 (재고 관리)</div>
      ${matGroupHtml}`;
  },

  _implantUsage(y, m) {
    const admin = Auth.isAdmin();
    const fixtureUsage = DB.getFixtureUsage().filter(r => inMonth(r.date, y, m));
    const matUsage = DB.getMatUsage().filter(r => inMonth(r.date, y, m));
    const fixtures = DB.getFixtures();
    const mats = DB.getImplantMaterials();

    const allUsage = [
      ...fixtureUsage.map(r => {
        const f = fixtures.find(x => x.id === r.fixture_id);
        const typeStr = f?.fixture_type ? ` ${f.fixture_type}` : '';
        return { ...r, label: f ? `[${f.company}]${typeStr} ${f.diameter}×${f.length}mm` : '알 수 없음', cost: (f?.unit_price||0) * r.quantity, type: 'fixture' };
      }),
      ...matUsage.map(r => {
        const mat = mats.find(x => x.id === r.mat_id);
        return { ...r, label: mat ? `[${mat.category}] ${mat.name}` : '알 수 없음', cost: (mat?.unit_price||0) * r.quantity, type: 'mat' };
      })
    ].sort((a,b) => b.date.localeCompare(a.date) || (b.patient_no||'').localeCompare(a.patient_no||''));

    const totalCost = sum(allUsage, r => r.cost);
    const cols = admin ? 7 : 6;

    let rows = '';
    if (allUsage.length) {
      const groups = [];
      let lastKey = null;
      allUsage.forEach(r => {
        const key = `${r.date}||${r.patient_name||''}||${r.patient_no||''}`;
        if (key !== lastKey) { groups.push({ key, date: r.date, patient_name: r.patient_name, patient_no: r.patient_no, items: [] }); lastKey = key; }
        groups[groups.length-1].items.push(r);
      });

      rows = groups.map(g => {
        const gCost = sum(g.items, r => r.cost);
        const gKey = encodeURIComponent(g.date + '||' + (g.patient_name||'') + '||' + (g.patient_no||''));
        const header = `<tr style="background:var(--primary-light)">
          <td colspan="${cols-1}" style="padding:7px 10px">
            <span style="font-weight:700">${fmt.dateFull(g.date)}</span>
            <span style="font-weight:600;margin-left:10px">${g.patient_name||'환자'}</span>
            <span class="badge badge-blue" style="margin-left:6px">${g.patient_no||'-'}</span>
            ${admin ? `<span style="float:right;font-weight:600;font-size:12px">${fmt.won(gCost)}</span>` : ''}
          </td>
          <td style="background:var(--primary-light);white-space:nowrap">
            <button class="btn btn-secondary btn-sm" onclick="Pages.editUsageGroupModal('${gKey}')">수정</button>
          </td>
        </tr>`;
        const itemRows = g.items.map(r => `<tr>
          <td style="padding-left:20px;color:var(--gray-400);font-size:12px">${r.tooth||''}</td>
          <td>${r.label}${r.fail ? ' <span class="badge badge-red" style="font-size:10px">페일</span>' : ''}</td>
          <td class="text-center">${r.quantity}개</td>
          <td style="color:var(--gray-400);font-size:12px">${r.memo||''}</td>
          ${admin ? `<td class="text-right amount">${fmt.won(r.cost)}</td>` : ''}
          <td><button class="btn btn-danger btn-sm" onclick="Pages.deleteUsage(${r.id},'${r.type}')">삭제</button></td>
        </tr>`).join('');
        return header + itemRows;
      }).join('');
    } else {
      rows = `<tr><td colspan="${cols}" class="tbl-empty">이번 달 사용 기록이 없습니다</td></tr>`;
    }

    return `
      <div class="card-header" style="padding:0;margin-bottom:16px">
        <div>
          <div class="card-title">사용 기록 (수술별)</div>
          ${admin ? `<div style="font-size:12px;color:var(--gray-400)">이달 재료비: <strong>${fmt.won(totalCost)}</strong></div>` : ''}
        </div>
        <button class="btn btn-primary" onclick="Pages.addUsageModal()">+ 사용 기록</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>치식</th><th>사용 품목</th><th class="text-center">수량</th><th>메모</th>${admin?'<th class="text-right">재료비</th>':''}<th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  },

  _implantOrders(y, m) {
    const admin = Auth.isAdmin();
    const orders = DB.getImplantOrders().filter(r => inMonth(r.date, y, m));
    // 품목별 입고확인 합계
    const totalConfirmed = sum(orders.filter(r => r.item_status === '입고확인'), r => r.total||0);

    // order_group_id 기준으로 그룹화
    const groupMap = {};
    [...orders].sort((a,b) => b.date.localeCompare(a.date)).forEach(r => {
      const gid = r.order_group_id || r.id;
      if (!groupMap[gid]) groupMap[gid] = { gid, items: [], date: r.date, vendor: r.vendor, status: r.status, memo: r.memo };
      groupMap[gid].items.push(r);
    });
    const groups = Object.values(groupMap).sort((a,b) => b.date.localeCompare(a.date));

    const groupBadge = s => s === '주문서 발행 완료'
      ? `<span class="badge" style="background:#ede9fe;color:#7c3aed">주문서 발행 완료</span>`
      : `<span class="badge badge-orange">주문서 작성</span>`;

    const itemBadge = ist => {
      if (ist === '입고확인')  return `<span class="badge badge-green" style="font-size:10px">입고확인</span>`;
      if (ist === '반품 신청') return `<span class="badge" style="background:#fee2e2;color:#dc2626;font-size:10px">반품 신청</span>`;
      if (ist === '반품완료')  return `<span class="badge badge-gray" style="font-size:10px">반품완료</span>`;
      return `<span style="color:var(--gray-400);font-size:11px">대기</span>`;
    };

    const rows = groups.length
      ? groups.map(g => {
          const st = g.status || '주문서 작성';
          const isPublished = st === '주문서 발행 완료';
          const rowStyle = isPublished ? ' style="background:#f5f3ff"' : '';
          const groupTotal = sum(g.items, i => i.total||0);

          const itemLines = g.items.map(r => {
            let name = r.item_name || '';
            if (r.item_type === 'fixture' && r.item_id) {
              const fx = DB.getFixtures().find(x => x.id === r.item_id);
              if (fx?.fixture_type && !name.includes(fx.fixture_type)) name += ` <span style="color:var(--gray-400);font-size:11px">${fx.fixture_type}</span>`;
            }
            if (r.item_type === 'mat' && r.item_id) {
              const mat = DB.getImplantMaterials().find(x => x.id === r.item_id);
              if (mat?.spec && !name.includes(mat.spec)) name += ` <span style="color:var(--gray-400);font-size:11px">${mat.spec}</span>`;
            }
            const ist = r.item_status || '';
            const itemActions = isPublished
              ? ist === '입고확인'
                ? `${itemBadge(ist)} <button style="font-size:10px;padding:2px 6px" class="btn btn-secondary btn-sm" onclick="Pages.setItemStatus(${r.id},'')">취소</button>`
                : ist === '반품 신청'
                  ? `${itemBadge(ist)} <button style="font-size:10px;padding:2px 6px;background:#16a34a;color:#fff" class="btn btn-sm" onclick="Pages.setItemStatus(${r.id},'반품완료')">반품완료</button>
                     <button style="font-size:10px;padding:2px 6px" class="btn btn-secondary btn-sm" onclick="Pages.setItemStatus(${r.id},'')">취소</button>`
                  : ist === '반품완료'
                    ? `${itemBadge(ist)} <button style="font-size:10px;padding:2px 6px" class="btn btn-secondary btn-sm" onclick="Pages.setItemStatus(${r.id},'반품 신청')">되돌리기</button>`
                    : `<button style="font-size:10px;padding:2px 6px;background:#22c55e;color:#fff" class="btn btn-sm" onclick="Pages.setItemStatus(${r.id},'입고확인')">입고확인</button>
                       <button style="font-size:10px;padding:2px 6px;background:#dc2626;color:#fff" class="btn btn-sm" onclick="Pages.setItemStatus(${r.id},'반품 신청')">반품 신청</button>`
              : itemBadge(ist);
            return `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;border-bottom:1px solid var(--gray-100)">
              <span style="flex:1">${name} <span style="color:var(--gray-500)">× ${r.quantity}</span>${admin ? ` <span style="color:var(--gray-400)">(${fmt.won(r.unit_price||0)})</span>` : ''}</span>
              <span style="white-space:nowrap">${itemActions}</span>
            </div>`;
          }).join('');

          const groupActions = st === '주문서 작성'
            ? `<button class="btn btn-sm" style="background:#7c3aed;color:#fff" onclick="Pages.setOrderStatus(${g.gid},'주문서 발행 완료')">주문서 발행</button>
               <button class="btn btn-secondary btn-sm" onclick="Pages.addOrderModal(${g.gid})">수정</button>`
            : `<button class="btn btn-secondary btn-sm" onclick="Pages.setOrderStatus(${g.gid},'주문서 작성')">발행 취소</button>`;

          return `<tr${rowStyle}>
            <td>${groupBadge(st)}</td>
            <td>${fmt.dateFull(g.date)}</td>
            <td>${g.vendor||''}</td>
            <td style="min-width:280px">${itemLines}</td>
            ${admin ? `<td class="text-right amount">${fmt.won(groupTotal)}</td>` : ''}
            <td style="color:var(--gray-400);font-size:12px;max-width:100px">${g.memo||''}</td>
            <td style="white-space:nowrap;vertical-align:top;padding-top:8px">
              ${groupActions}
              <button class="btn btn-danger btn-sm" onclick="Pages.deleteImplantOrder(${g.gid})">삭제</button>
            </td>
          </tr>`;
        }).join('')
      : `<tr><td colspan="${admin?7:6}" class="tbl-empty">이번 달 주문 기록이 없습니다</td></tr>`;

    return `
      <div class="card-header" style="padding:0;margin-bottom:16px">
        <div>
          <div class="card-title">주문 기록</div>
          ${admin ? `<div style="font-size:12px;color:var(--gray-400)">이달 입고확인 합계: <strong>${fmt.won(totalConfirmed)}</strong></div>` : ''}
        </div>
        <button class="btn btn-primary" onclick="Pages.addOrderModal()">+ 주문 추가</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>상태</th><th>날짜</th><th>거래처</th><th>품목</th>${admin?'<th class="text-right">합계</th>':''}<th>비고</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  },

  _implantReturns(y, m) {
    const admin = Auth.isAdmin();
    const allUsage = DB.getFixtureUsage().filter(r => r.fail);
    const monthly = allUsage.filter(r => inMonth(r.date, y, m));
    const fixtures = DB.getFixtures();
    const sorted = [...monthly].sort((a,b) => b.date.localeCompare(a.date));
    const cols = admin ? 8 : 6;
    const rows = sorted.length ? sorted.map(r => {
      const f = fixtures.find(x => x.id === r.fixture_id);
      const typeStr = f?.fixture_type ? ` ${f.fixture_type}` : '';
      const label = f ? `[${f.company}]${typeStr} ${f.diameter}×${f.length}mm` : '알 수 없음';
      const rs = r.return_status || '반품 대기';
      const rsBadge = rs === '반품 완료'
        ? `<span class="badge badge-green">반품 완료</span>`
        : rs === '반품 신청'
          ? `<span class="badge" style="background:#fee2e2;color:#dc2626">반품 신청</span>`
          : `<span class="badge badge-orange">반품 대기</span>`;
      const actionBtns = rs === '반품 완료'
        ? `<button class="btn btn-sm btn-secondary" onclick="Pages.setReturnStatus(${r.id},'반품 대기')">대기로 변경</button>`
        : rs === '반품 신청'
          ? `<button class="btn btn-sm btn-primary" onclick="Pages.setReturnStatus(${r.id},'반품 완료')">반품 완료</button>
             <button class="btn btn-sm btn-secondary" onclick="Pages.setReturnStatus(${r.id},'반품 대기')">취소</button>`
          : `<button class="btn btn-sm" style="background:#dc2626;color:#fff" onclick="Pages.setReturnStatus(${r.id},'반품 신청')">반품 신청</button>`;
      return `<tr class="${rs === '반품 완료' ? 'status-received' : rs === '반품 신청' ? 'status-return' : 'status-order'}">
        <td>${rsBadge}</td>
        <td>${fmt.dateFull(r.date)}</td>
        <td>${r.patient_name||'-'}</td>
        <td><span class="badge badge-blue">${r.patient_no||'-'}</span></td>
        <td>${label}</td>
        <td class="text-center">${r.quantity}개</td>
        ${admin ? (() => {
          const cost = (f?.unit_price||0)*r.quantity;
          return rs === '반품 완료'
            ? `<td class="text-right" style="color:var(--gray-400)"><s style="font-size:11px">${fmt.won(cost)}</s> → <strong>₩0</strong></td>`
            : `<td class="text-right amount" style="color:var(--red)">${fmt.won(cost)}</td>`;
        })() : ''}
        <td style="color:var(--gray-400);font-size:12px">${r.memo||''}</td>
        <td style="white-space:nowrap">${actionBtns}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="${cols}" class="tbl-empty">이번 달 반품 기록이 없습니다</td></tr>`;

    // 반품 완료된 픽스쳐는 손실에서 제외
    const totalLoss = admin ? sum(monthly.filter(r => r.return_status !== '반품 완료'), r => { const f = fixtures.find(x=>x.id===r.fixture_id); return (f?.unit_price||0)*r.quantity; }) : 0;

    return `
      <div class="card-header" style="padding:0;margin-bottom:16px">
        <div>
          <div class="card-title">페일 픽스쳐 기록</div>
          ${admin && monthly.length ? `<div style="font-size:12px;color:var(--gray-400)">이달 실손실액: <strong style="color:var(--red)">${fmt.won(totalLoss)}</strong></div>` : ''}
        </div>
      </div>
      <div class="alert" style="background:#fef2f2;border-color:#fecaca;color:#b91c1c;font-size:13px">⚠️ 사용 기록에서 <strong>페일</strong> 체크된 픽스쳐만 표시됩니다. 재고는 사용 기록 시 이미 차감됩니다.</div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>상태</th><th>날짜</th><th>환자명</th><th>환자번호</th><th>픽스쳐</th><th class="text-center">수량</th>${admin?'<th class="text-right">손실액</th>':''}<th>메모</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  },

  setReturnStatus(id, newStatus) {
    const data = DB.getFixtureUsage();
    const rec = data.find(r => r.id === id);
    if (!rec) return;

    const doUpdate = () => {
      const data2 = DB.getFixtureUsage();
      const rec2 = data2.find(r => r.id === id);
      if (!rec2) return;
      rec2.return_status = newStatus;
      DB.saveFixtureUsage(data2);
      Pages.implant(App.year, App.month);
    };

    if (newStatus === '반품 신청') {
      const fx = DB.getFixtures().find(x => x.id === rec.fixture_id);
      const vendorInfo = fx?.vendor ? DB.getVendors().find(v => v.name === fx.vendor) : null;
      const phone = vendorInfo?.phone;
      if (phone) {
        const fxName = fx ? `${fx.company} 픽스쳐 ${fx.fixture_type||''} ${fx.diameter}×${fx.length}mm`.replace(/\s+/g,' ').trim() : '픽스쳐';
        const text = `[조이치과] 반품 신청\n거래처: ${fx.vendor}\n품목: ${fxName} × ${rec.quantity}개\n사유: 픽스쳐 페일`;
        smsConfirm(text, () => { doUpdate(); sendSms(phone, text); });
        return;
      }
    }
    doUpdate();
  },

            <button class="btn btn-secondary btn-sm" onclick="Pages.editCompanyModal(${i})">수정</button>
            <button class="btn btn-danger btn-sm" onclick="Pages.deleteCompany(${i})">삭제</button>
          </div>`).join('') || '<div style="color:var(--gray-400);font-size:12px;padding:4px 0">등록된 제조사 없음</div>'}
      </div>`;

  // Fixture CRUD
  editFixtureModal(id) {
    const f = id ? DB.getFixtures().find(x => x.id === id) : null;
    const coOpts = getCompanies().map(c => `<option value="${c}" ${f?.company===c?'selected':''}>${c}</option>`).join('');
    showModal(`<div class="modal">
      <div class="modal-title">${f?'픽스쳐 수정':'픽스쳐 추가'}</div>
      <form onsubmit="Pages.saveFixture(event,${id||'null'})">
        <div class="form-grid">
          <div class="form-group"><label>제조사</label><select name="company">${coOpts}</select></div>
          <div class="form-group"><label>제품 종류</label><input type="text" name="fixture_type" value="${f?.fixture_type||''}" placeholder="예: TSIII, TSIV, SS II, BL, SLA"></div>
          <div class="form-group"><label>직경 (mm)</label><input type="number" name="diameter" value="${f?.diameter||''}" step="0.01" min="1" required placeholder="예: 3.5"></div>

          ${Auth.isAdmin() ? `<div class="form-group"><label>단가 (원)</label><input type="number" name="unit_price" value="${f?.unit_price||''}" min="0" step="100" required placeholder="0"></div>` : ''}
          <div class="form-group"><label>현재 재고 (개)</label><input type="number" name="stock" value="${f?.stock||0}" min="0" required></div>
          <div class="form-group"><label>최소 재고 알림 (개)</label><input type="number" name="min_stock" value="${f?.min_stock ?? 2}" min="0" step="1"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button>
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </form>
    </div>`);
  },
  saveFixture(e, editId) {
    e.preventDefault();
    const f = new FormData(e.target);
    const data = DB.getFixtures();
    const getPrice = (existing) => Auth.isAdmin() ? +f.get('unit_price') : (existing || 0);
    const base = { company: f.get('company'), fixture_type: f.get('fixture_type'), diameter: +f.get('diameter'), length: +f.get('length'), stock: +f.get('stock'), min_stock: +f.get('min_stock') };
    if (editId) {
      const idx = data.findIndex(x => x.id === editId);

  // Usage Modal — 수술 1건에 재료 여러 개 입력
  _usageRowCount: 0,
  _usageItemOpts: '',

  _buildItemOpts() {
    const fixtures = DB.getFixtures();
    const mats = DB.getImplantMaterials();
    const fOpts = fixtures.length
      ? fixtures.sort((a,b)=>a.company.localeCompare(b.company)||(a.fixture_type||'').localeCompare(b.fixture_type||'')||(+a.diameter)-(+b.diameter))
          .map(f=>{ const t=f.fixture_type?` ${f.fixture_type}`:''; return `<option value="fixture_${f.id}">[${f.company}]${t} ${f.diameter}×${f.length}mm (재고:${f.stock})</option>`; }).join('')
      : '';
    const mOpts = mats.map(m=>{
      if (getUsageOnlyCats().includes(m.category)) return '';
      const spec = m.spec ? ` ${m.spec}` : '';
      const s = isTrackInventory(m.category)?` (재고:${m.stock}${m.unit||'개'})`:'';
      return `<option value="mat_${m.id}">[${m.category}] ${m.name}${spec}${s}</option>`;
    }).join('');
    return { fOpts, mOpts, hasItems: !!(fOpts||mOpts) };
  },

  _usageRowHtml(idx, fOpts, mOpts) {
    return `<tr id="urow-${idx}">
      <td style="min-width:260px">
        <select name="item_key_${idx}" onchange="Pages._onUsageItemChange(${idx},this)" style="width:100%">

      <td><input type="number" name="qty_${idx}" value="1" min="1" style="width:55px" required></td>
      <td><input type="text" name="memo_${idx}" placeholder="메모" style="width:110px"></td>
      <td id="fail-cell-${idx}" style="text-align:center;min-width:50px"></td>
      <td><button type="button" class="btn btn-danger btn-sm" onclick="Pages._removeUsageRow(${idx})">×</button></td>
    </tr>`;
  },

  _onUsageItemChange(idx, sel) {

  saveUsage(e) {
    e.preventDefault();
    const f = new FormData(e.target);
    const date = f.get('date');
    const patient_name = f.get('patient_name');
    const patient_no = f.get('patient_no');

    const fixtures = DB.getFixtures();
    const mats = DB.getImplantMaterials();
    const fixtureUsage = DB.getFixtureUsage();
    const matUsage = DB.getMatUsage();

    // 재고 검증 먼저
    for (let i = 0; i < Pages._usageRowCount; i++) {
      const sel = document.querySelector(`[name="item_key_${i}"]`);
      if (!sel || !document.getElementById(`urow-${i}`)) continue;
      const val = sel.value;
      if (!val) continue;
      const [type, rawId] = val.split('_');
      const id = +rawId;
      const qty = +(document.querySelector(`[name="qty_${i}"]`)?.value || 1);
      if (type === 'fixture') {
        const fx = fixtures.find(x => x.id === id);
        if (fx && fx.stock < qty) { alert(`재고 부족!\n${fx.company} ${fx.diameter}×${fx.length}mm\n현재 재고: ${fx.stock}개`); return; }
      } else {
        const mat = mats.find(x => x.id === id);
        if (mat && isTrackInventory(mat.category) && mat.stock < qty) { alert(`재고 부족!\n${mat.name}\n현재 재고: ${mat.stock}${mat.unit||'개'}`); return; }
      }
    }

    // 저장
    for (let i = 0; i < Pages._usageRowCount; i++) {
      const sel = document.querySelector(`[name="item_key_${i}"]`);
      if (!sel || !document.getElementById(`urow-${i}`)) continue;
      const val = sel.value;
      if (!val) continue;
      const [type, rawId] = val.split('_');
      const id = +rawId;
      const qty = +(document.querySelector(`[name="qty_${i}"]`)?.value || 1);
      const tooth = document.querySelector(`[name="tooth_${i}"]`)?.value || '';
      const memo = document.querySelector(`[name="memo_${i}"]`)?.value || '';
      const fail = !!(document.querySelector(`[name="fail_${i}"]`)?.checked);

      if (type === 'fixture') {
        const fx = fixtures.find(x => x.id === id);
        if (fx) { fx.stock -= qty; }
        fixtureUsage.push({ id: DB.nextId('fusage'), date, patient_name, patient_no, tooth, fixture_id: id, quantity: qty, memo, fail });
      } else {
        const mat = mats.find(x => x.id === id);
        if (mat && isTrackInventory(mat.category)) { mat.stock -= qty; }
        matUsage.push({ id: DB.nextId('musage'), date, patient_name, patient_no, tooth, mat_id: id, quantity: qty, memo });
      }
    }

    DB.saveFixtures(fixtures);
    DB.saveImplantMaterials(mats);
    DB.saveFixtureUsage(fixtureUsage);
    DB.saveMatUsage(matUsage);
    closeModal();
    Pages.implant(App.year, App.month);
  },
  deleteUsage(id, type) {
    confirm2('사용 기록을 삭제하시겠습니까? (재고는 자동으로 복원됩니다)', () => {
      if (type === 'fixture') {
        const usage = DB.getFixtureUsage();
        const rec = usage.find(x => x.id === id);
        if (rec) {
          const fixtures = DB.getFixtures();
          const fx = fixtures.find(x => x.id === rec.fixture_id);
          if (fx) { fx.stock += rec.quantity; DB.saveFixtures(fixtures); }
          DB.saveFixtureUsage(usage.filter(x => x.id !== id));
        }
      } else {
        const usage = DB.getMatUsage();
        const rec = usage.find(x => x.id === id);
        if (rec) {
          const mats = DB.getImplantMaterials();
          const mat = mats.find(x => x.id === rec.mat_id);
          if (mat && isTrackInventory(mat.category)) { mat.stock += rec.quantity; DB.saveImplantMaterials(mats); }
          DB.saveMatUsage(usage.filter(x => x.id !== id));
        }
      }
      Pages.implant(App.year, App.month);
    });
  },
